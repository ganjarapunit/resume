<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punit Ganjara | Interactive Portfolio</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff; font-family: Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
            background: #20457c;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: block !important;
        }

        .wrapper { 
            display: block; 
            width: 100%; 
            min-height: 100vh;
            position: relative; 
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100%;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 40px 20px;
            box-sizing: border-box;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1500;
            transform: translateX(-100%);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        /* ── Dark Theme ── */
        [data-theme="dark"] {
            --bg-dark: #0b1120;
            --text-dark: #e2e8f0;
            --text-muted-dark: #94a3b8;
            --card-bg-dark: rgba(30,41,59,0.85);
            --border-dark: #334155;
        }
        [data-theme="dark"] body,
        [data-theme="dark"] .sidebar,
        [data-theme="dark"] .content-area { background-color: var(--bg-dark); color: var(--text-dark); }
        [data-theme="dark"] .sidebar { border-right-color: var(--border-dark); }
        [data-theme="dark"] .sidebar a { color: var(--text-dark); }
        [data-theme="dark"] .sidebar h1 { color: #60a5fa; }
        [data-theme="dark"] .sidebar p { color: var(--text-dark); }
        [data-theme="dark"] .menu-toggle { background: #3b82f6; }

        .theme-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            width: 44px; height: 44px; border-radius: 10px;
            background: white; border: 1px solid #ddd;
            box-shadow: 0 4px 14px rgba(0,0,0,.08);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #64748b; transition: all .25s ease;
        }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle:hover { background: #20457c; color: white; transform: scale(1.05); }
        [data-theme="dark"] .theme-toggle { background: rgba(30,41,59,0.8); border-color: #334155; }
        [data-theme="dark"] .theme-toggle:hover { background: #3b82f6; color: white; }

        @media (max-width: 768px) {
            .theme-toggle { width: 38px; height: 38px; top: 20px; right: 14px; }
            .theme-toggle svg { width: 17px; height: 17px; }
        }

        /* ── rest of original styles ── */
        .overlay-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1400;
        }
        .overlay-bg.active { display: block; }

        .sidebar img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #20457c;
        }

        .sidebar h1 {
            font-size: 1.3rem;
            color: #20457c;
            margin: 0 0 5px;
        }

        .sidebar p {
            color: #555;
            font-size: 0.9rem;
            margin: 0 0 20px;
        }

        .sidebar a {
            display: block;
            width: 100%;
            padding: 12px 15px;
            text-decoration: none;
            color: #333;
            font-size: 0.95rem;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .sidebar a:hover {
            background-color: #f0f4ff;
            color: #20457c;
        }

        .content-area {
            margin-left: 0;
            padding: 100px 20px 20px;
            min-height: 100vh;
            background-color: #ffffff;
        }

        @media (min-width: 769px) {
            .sidebar { transform: translateX(0); }
            .menu-toggle { display: none !important; }
            .content-area { margin-left: 300px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"
            aria-label="Toggle dark mode" title="Toggle dark mode">
        <i data-lucide="moon" id="themeIcon"></i>
    </button>

    <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>
    <div class="overlay-bg" id="overlay-bg" onclick="toggleSidebar()"></div>
    <div class="wrapper">
        <aside class="sidebar" id="sidebar">
            <img src="../profile.png" alt="Punit Ganjara">
            <h1>Punit Ganjara</h1>
            <p>Learning Experience Designer</p>
            <a href="../">← Back to Portfolio</a>
            <a href="../h5p.html">Interactive Resume</a>
            <a href="index.html">IELTS Speaking Masterclass</a>
            <a href="../interactive-quiz/">Interactive Quiz</a>
            <a href="../wcag-report/">WCAG Accessibility Report</a>
        </aside>

        <main class="content-area">
            <div id="h5p-container"></div>
        </main>
    </div>

    <script src="main.bundle.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const bg = document.getElementById('overlay-bg');
            sidebar.classList.toggle('active');
            bg.classList.toggle('active');
        }

        const el = document.getElementById('h5p-container');
        const options = {
            h5pJsonPath: './activity-data', 
            frameJs: './frame.bundle.js',
            frameCss: './styles/h5p.css',
            start_at_end: true 
        };
        new H5PStandalone.H5P(el, options);

        /* ── Theme Toggle ── */
        function toggleTheme(){
            var html=document.documentElement;
            var isDark=html.getAttribute('data-theme')==='dark';
            html.setAttribute('data-theme',isDark?'light':'dark');
            localStorage.setItem('theme',isDark?'light':'dark');
            updateThemeIcon();
        }
        function updateThemeIcon(){
            var icon=document.getElementById('themeIcon');
            if(!icon)return;
            var isDark=document.documentElement.getAttribute('data-theme')==='dark';
            icon.setAttribute('data-lucide',isDark?'sun':'moon');
            if(typeof lucide!=='undefined')lucide.createIcons();
        }
        (function(){
            var saved=localStorage.getItem('theme');
            if(saved){document.documentElement.setAttribute('data-theme',saved);}
            else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
            updateThemeIcon();
        })();
    </script>
</body>
</html>
