<!-- CRITICAL: Alert interception + Theme init — must run BEFORE Adapt scripts -->
<script>
(function() {
  /* ── Theme init (runs before any rendering) ── */
  var saved = localStorage.getItem('theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.classList.add('theme-' + theme);

  /* ── Modal helpers (called by alert/confirm overrides, defined early) ── */
  window.showCustomModal = function(title, message, isError) {
    var modal = document.getElementById('customModal');
    if (!modal) { console.warn('[Modal not ready]', title, message); return; }
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    var cancelBtn = document.querySelector('.custom-modal-btn-secondary');
    if (cancelBtn) cancelBtn.style.display = isError ? 'none' : 'block';
    modal.classList.add('active');
    document.addEventListener('keydown', modalKeyHandler);
    var okBtn = document.getElementById('modalOkBtn');
    if (okBtn) okBtn.focus();
  };
  window.closeModal = function() {
    var m = document.getElementById('customModal');
    if (m) {
      m.classList.remove('active');
      document.removeEventListener('keydown', modalKeyHandler);
    }
  };

  /* ── Modal focus trap + Escape key ── */
  var modalKeyHandler = function(e) {
    if (e.key === 'Escape') { window.closeModal(); return; }
    if (e.key !== 'Tab') return;
    var modal = document.querySelector('#customModal .custom-modal');
    if (!modal) return;
    var focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first) { e.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };

  /* ── Alert/Confirm override ── */
  var origAlert = window.alert;
  var origConfirm = window.confirm;
  window.alert = function(msg) {
    if (typeof msg === 'string' && msg.indexOf('not connected to the Learning Management System') !== -1) {
      console.warn('[LMS] Connection error suppressed (standalone mode)');
      return;
    }
    window.showCustomModal('Notification', String(msg));
  };
  window.confirm = function(msg) {
    if (typeof msg === 'string' && msg.indexOf('not connected') !== -1) {
      console.warn('[LMS] Confirm suppressed (standalone mode)');
      return true;
    }
    return true;
  };

  /* ── Block SCORM Log window ── */
  var origOpen = window.open;
  window.open = function(url, name, features) {
    if (url && url.indexOf('log_output.html') !== -1) {
      console.warn('[SCORM] Log window blocked');
      return null;
    }
    return origOpen.apply(this, arguments);
  };
})();
</script>

<div id="nameEntryOverlay" class="name-entry-overlay" role="dialog" aria-labelledby="nameEntryTitle" aria-modal="true">
  <div class="name-entry-card">
    <h1 class="name-entry-title" id="nameEntryTitle">Welcome</h1>
    <p class="name-entry-subtitle">LXD Design Frameworks &amp; Evaluation Standards</p>
    <p class="name-entry-desc">Enter your name to begin. This helps track your progress through the course.</p>
    <div class="name-entry-field">
      <label for="learnerName">Your Name <span class="required">*</span></label>
      <input type="text" id="learnerName" placeholder="e.g. Sarah Chen" required aria-required="true" autocomplete="name">
    </div>
    <div class="name-entry-field">
      <label for="learnerEmail">Email <span class="optional">(optional)</span></label>
      <input type="email" id="learnerEmail" placeholder="e.g. sarah@example.com" autocomplete="email">
    </div>
    <div id="nameEntryError" class="name-entry-error"></div>
    <button id="startCourseBtn" class="name-entry-btn">Start Course →</button>
  </div>
</div>
<script>
(function() {
  var overlay = document.getElementById('nameEntryOverlay');
  var nameInput = document.getElementById('learnerName');
  var emailInput = document.getElementById('learnerEmail');
  var startBtn = document.getElementById('startCourseBtn');
  var errorEl = document.getElementById('nameEntryError');

  function encodeHtml(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    nameInput.style.borderColor = 'var(--error)';
  }

  function hideError() {
    errorEl.style.display = 'none';
    nameInput.style.borderColor = '';
  }

  // If name already stored: show brief welcome back then dismiss
  var storedName = localStorage.getItem('xapi_learner_name');
  if (storedName) {
    overlay.style.display = 'flex';
    document.querySelector('.name-entry-card').innerHTML =
      '<h1 class="name-entry-title">Welcome back!</h1>' +
      '<p class="name-entry-desc">Continuing as <strong>' + encodeHtml(storedName) + '</strong></p>' +
      '<p class="name-entry-desc" style="font-size:0.85rem;color:var(--text-muted)">Starting course...</p>';
    setTimeout(function() {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s ease';
      setTimeout(function() { overlay.style.display = 'none'; }, 400);
    }, 1200);
    return;
  }

  // First visit: show overlay, require name entry
  overlay.style.display = 'flex';
  nameInput.focus();
  hideError();

  function dismissOverlay() {
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity 0.4s ease';
    setTimeout(function() { overlay.style.display = 'none'; }, 400);
  }

  startBtn.addEventListener('click', function() {
    var name = nameInput.value.trim();
    if (!name) {
      showError('Please enter your name to continue.');
      nameInput.focus();
      return;
    }
    hideError();
    startBtn.disabled = true;
    startBtn.textContent = 'Starting...';
    startBtn.classList.add('name-entry-btn-loading');

    localStorage.setItem('xapi_learner_name', name);
    var email = emailInput.value.trim();
    if (email) {
      localStorage.setItem('xapi_learner_email', email);
    }
    dismissOverlay();
  });

  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { hideError(); startBtn.click(); }
  });
  emailInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { hideError(); startBtn.click(); }
  });
})();
</script>

      {text: 'SAM (Successive Approximation Model) — iterative prototyping with frequent stakeholder reviews.', feedback: 'SAM\'s \'savvy start\' lets you prototype rapidly and refine through stakeholder feedback. Ideal for tight deadlines where quality still matters.'},
      {text: 'Dick & Carey Model — the systems-oriented approach with 10 sequential components.', feedback: 'Dick & Carey is thorough but over-engineered for a 3-week compliance course. Too much front-end analysis for the timeline.'},
      {text: 'Agile / LLAMA — full iterative development with minimal up-front design.', feedback: 'Agile works well for software but can skip critical learner analysis in LXD. SAM offers a better balance for this context.'}
    ]},
    'c-b-003': { question: 'How do you handle the PM\'s request?', correct_idx: 0, items: [
      {text: 'Push back respectfully — explain that without a learner analysis, you risk building a course that doesn\'t address the actual performance gaps across different departments', feedback: 'You advocated for the learner and the process — that\'s senior LXD leadership. A targeted 2-day analysis sprint addresses the PM\'s timeline while gathering critical data.'},
      {text: 'Accept the PM\'s shortcut but plan a quick survey during development to gather learner data retroactively', feedback: 'A retroactive survey won\'t capture the performance gaps you need to design for. Push back with a lighter-weight analysis plan instead.'},
      {text: 'Propose a full ADDIE analysis phase including stakeholder interviews, job observation, and performance analysis', feedback: 'A full ADDIE analysis is overkill for a 3-week timeline. Propose a targeted 2-day sprint: stakeholder interviews plus a quick learner survey.'}
    ]},
    'c-b-004': { question: 'Which evaluation level?', correct_idx: 2, items: [
      {text: 'Level 1: Reaction — Did learners enjoy the course? Use smile sheets and satisfaction surveys.', feedback: 'Smile sheets show satisfaction, not behavior change. For proving workplace impact, you need Level 3 (Behavior) or higher.'},
      {text: 'Level 2: Learning — Did learners acquire the knowledge? Use pre/post test scores.', feedback: 'Test scores prove learning occurred, not whether it transferred to the job. Behavior change requires Level 3.'},
      {text: 'Level 3: Behavior — Are learners applying data privacy practices on the job? Use observation, manager reports, or audit data.', feedback: 'Level 3 is where you prove the training changed workplace practices — through audits, manager observations, or performance data.'}
    ]},
    'c-b-005': { question: 'What evaluation now?', correct_idx: 0, items: [
      {text: 'Formative evaluation — analyze the pilot data, identify knowledge gaps, revise content, and re-test before full launch', feedback: 'Formative evaluation is exactly right. You are in development with data that needs action. Fix it now before 500+ employees see it.'},
      {text: 'Summative evaluation — launch as planned and measure the final outcome at the end, treating 60% as your baseline', feedback: 'Launching with a 60% pass rate is premature. Formative evaluation lets you diagnose and fix gaps in the remaining 2 weeks.'},
      {text: 'Phillips ROI evaluation — calculate the monetary return on investment based on projected improvement from the pilot data', feedback: 'Phillips ROI is premature here. You need to fix the learning intervention first before measuring its financial return.'}
    ]},
    'c-b-006': { question: 'How do you prove ROI?', correct_idx: 1, items: [
      {text: 'Kirkpatrick Level 4: Results — report organizational impact metrics like reduced data breaches or improved audit scores', feedback: 'Level 4 shows organizational impact but doesn\'t produce the monetary ROI percentage the VP needs for the board.'},
      {text: 'Phillips ROI Methodology — convert benefit data into monetary values, subtract program costs, and calculate the ROI percentage', feedback: 'Phillips ROI converts benefits to dollar values and calculates a clear percentage. This is exactly what the VP needs for the board presentation.'},
      {text: 'CIPP Model — evaluate Context, Input, Process, and Product to give a holistic picture of program value', feedback: 'CIPP provides a holistic evaluation but doesn\'t produce the hard monetary ROI figure the VP is asking for.'}
    ]},
    'c-b-008': { question: 'Can you scale globally?', correct_idx: 1, items: [
      {text: 'Translate the existing course exactly as-is into each language. Delivering on time is the priority — translations can be refined later.', feedback: 'Launching culturally insensitive content damages credibility. Learners in Tokyo or Berlin will disengage immediately. Always localize meaning, not just words.'},
      {text: 'Redesign the course for each locale with local SMEs: adapt examples, replace US-specific case studies, and run cultural sensitivity reviews. This will push the timeline but ensures quality.', feedback: 'This is best practice. Localizing at the cultural level ensures every learner feels the content was designed for them. Delaying quality global content is always worth it.'},
      {text: 'Replace all text with icons and visuals so it\'s \'culture-free.\' That way you don\'t need translation or localization.', feedback: 'There is no such thing as \'culture-free\' design. Visuals carry cultural meaning too — colors, symbols, gestures, and even layouts vary across cultures. Always involve local SMEs.'}
    ]},
    'c-b-009': { question: 'How do you recover?', correct_idx: 0, items: [
      {text: 'Apologize for the oversight, take full ownership, and present a revised plan with local SME involvement in each region.', feedback: 'Owning the mistake and presenting a concrete fix demonstrates senior leadership. Stakeholders trust practitioners who are honest and solution-oriented.'},
      {text: 'Explain that the \'original intent was good\' and ask the local teams to \'fix the language themselves\' to avoid delays.', feedback: 'Delegating your core responsibility to local teams undermines your role as an LXD professional. You own the learning experience globally.'},
      {text: 'Defend the original approach, citing the tight timeline as justification for the missteps.', feedback: 'Defensiveness erodes trust. Stakeholders value honesty and ownership over excuses. Acknowledging the error builds credibility for future collaboration.'}
    ]},
    'c-b-010': { question: 'Microlearning vs deep dive?', correct_idx: 1, items: [
      {text: 'Agree immediately — the CLO is the boss, and microlearning is a trend for a reason. Deliver 9 x 5-minute microlearning modules.', feedback: 'Blindly following trends without evidence undermines learning outcomes. Microlearning works for awareness-level content, not for complex topics requiring deep understanding.'},
      {text: 'Push back with evidence: research shows complex compliance topics require deeper processing. Propose a blended approach — microlearning for awareness, scenario-based deep dives for application.', feedback: 'Evidence-based persuasion is a hallmark of senior LXD practice. You balanced stakeholder desire with learning science — the blended approach is the gold standard here.'},
      {text: 'Propose a compromise: make the first 15 minutes microlearning-style and keep the remaining 30 minutes as a traditional e-learning module.', feedback: 'Compromising on structural integrity can create a disjointed experience. Better to design a coherent blend from the ground up rather than cut an existing course into pieces.'}
    ]},
    'c-b-011': { question: 'How accessible is your course?', correct_idx: 0, items: [
      {text: 'Conduct a full WCAG 2.1 AA audit, fix all critical violations, and build an accessibility checklist for future projects.', feedback: 'WCAG 2.1 AA is the industry standard. Fixing violations and building process safeguards prevents recurrence. This is what ethical LXD practice looks like.'},
      {text: 'Fix the alt-text and colour contrast issues now. Tackle the rest in a future update.', feedback: 'Partial fixes can still leave learners excluded. Keyboard traps and navigation issues are just as critical as alt-text. A comprehensive approach is the ethical minimum.'},
      {text: 'Suggest the learner use a different screen reader and hope the compliance audit doesn\'t catch the remaining issues.', feedback: 'Passively shifting responsibility to the learner is unacceptable. Accessibility is not optional — it\'s a fundamental requirement of professional LXD practice.'}
    ]},
    'c-b-012': { question: 'Was your training effective?', correct_idx: 0, items: [
      {text: 'Analyze the incident data: what knowledge gap did the breach expose? Use the findings to update the course with a targeted module on data handling protocols.', feedback: 'This is continuous improvement in action. Treating incidents as data points — not failures — is what separates exceptional LXDs from average ones.'},
      {text: 'Point to the 92% completion rate and positive feedback as proof the training worked. The breach was an isolated incident.', feedback: 'Completion rates and satisfaction scores don\'t prove behaviour change. True evaluation asks: did learners transfer the learning to their jobs? Use this as a diagnostic opportunity.'},
      {text: 'Blame Finance for not enforcing your recommended follow-up workshops. The training was fine — it\'s their fault for not mandating it.', feedback: 'Blame-shifting avoids accountability. A senior LXD practitioner owns the full learning ecosystem, including whether recommendations were implemented.'}
    ]},
    'c-b-013': { question: 'Find the real gap.', correct_idx: 0, items: [
      {text: 'Conduct a performance analysis: interview the employee, observe the workflow, and identify environmental barriers (workflow, tools, culture) that prevented application.', feedback: 'Performance analysis isolates whether the gap is a training problem or a workplace problem. Often, learners know what to do but workplace pressures override their training.'},
      {text: 'Add 5 more knowledge-check questions to the existing course to \'deepen understanding.\' If they pass these, the training worked.', feedback: 'More knowledge checks won\'t solve an application gap. The learner already passed the test — the issue is transfer to the job, not recall.'},
      {text: 'Survey all 500+ employees asking \'did you apply what you learned?\' and use the self-report data to guide your next move.', feedback: 'Self-report surveys about application are unreliable. Learners overestimate their own application. Direct observation and workflow analysis are far more diagnostic.'}
    ]},
    'c-b-014': { question: 'Which tech strategy?', correct_idx: 0, items: [
      {text: 'Implement xAPI for rich activity tracking, and use the data to build personalized learning pathways that adapt to each learner\'s knowledge gaps.', feedback: 'xAPI + adaptive pathways is the frontier of LXD. You\'ve connected data, personalisation, and scalability in one strategic move.'},
      {text: 'Stick with SCORM 1.2 — it\'s reliable, every LMS supports it, and upgrading risks compatibility issues with your current system.', feedback: 'SCORM 1.2 is stable but limited. It can\'t track granular activities or support modern features like adaptive pathways. Upgrade to xAPI for richer data.'},
      {text: 'Jump straight to VR training — immersive learning is the future, and this will position EdTech Corp as an industry innovator.', feedback: 'VR without a clear learning need is trend-chasing. The data breach gap requires better knowledge application, not immersion. Start with xAPI and adaptive design.'}
    ]},
    'c-b-015': { question: 'Pivot or push forward?', correct_idx: 0, items: [
      {text: 'Run a 2-day discovery sprint: interview learners, map current workflows, identify tech pain points, and prototype 3 solution options with estimated impact and cost.', feedback: 'A discovery sprint is efficient and evidence-based. You\'ll have a data-backed recommendation ready within the VP\'s timeline.'},
      {text: 'Research what competitors are using and recommend the most popular solution. If everyone is using it, it must be the right choice.', feedback: 'Copying competitors without understanding your own context leads to misaligned investments. Your learners\' needs, not competitors\' choices, should drive the decision.'},
      {text: 'Recommend doing nothing for now — gather more data over the next 6 months before making any tech changes.', feedback: 'Analysis paralysis is just as risky as impulsive decisions. A focused 2-day sprint gives you enough data for a confident recommendation.'}
    ]},
    'c-b-016': { question: 'Present at a conference?', correct_idx: 0, items: [
      {text: 'A transparent case study: show the ups, downs, data, failures, and lessons learned. Include the accessibility complaint, the breach incident, and how each challenge made the final product stronger.', feedback: 'Authentic case studies build real credibility. Sharing failures as well as successes positions you as a grounded, reflective practitioner — exactly what the industry needs more of.'},
      {text: 'A polished highlight reel: focus on the 96% satisfaction, the 92% completion rate, and the global rollout success story.', feedback: 'A highlight reel gets polite applause but little lasting impact. The audience learns more from your failures than your successes. Include the struggles.'},
      {text: 'Decline the opportunity — you\'re too busy building the next project. Suggest the VP present it instead.', feedback: 'Sharing your work at industry events builds your professional brand and elevates the LXD profession. It\'s not optional — it\'s part of being a senior practitioner.'}
    ]},
    'c-b-017': { question: 'What\'s your next move?', correct_idx: 0, items: [
      {text: 'Accept the Director role. Build a team that reflects your LXD values: evidence-based, learner-centered, and impact-driven. Your influence multiplies through others.', feedback: 'Moving into leadership when you\'re ready is a service to the profession. Great LXDs become great leaders who create more great LXDs. This is how the field grows.'},
      {text: 'Decline the Director role and stay hands-on. You love designing, and deep expertise matters as much as leadership.', feedback: 'Staying hands-on is a valid, powerful choice. Deep expertise drives innovation, and informal mentoring still elevates the field. Not everyone needs to manage people to lead.'},
      {text: 'Accept the Director role but keep designing everything yourself. You trust your own work more than anyone else\'s.', feedback: 'Holding onto both roles leads to burnout and bottlenecks your team. Leadership means letting go of control and growing others. Delegate the design, lead the vision.'}
    ]}
  };

  var visibleBlocks = ['b-001'];
  var choices = [];
  function getBlockId(block) {
    var m = block.className.match(/\bb-\d+\b/);
    return m ? m[0] : null;
  }

  function getCompId(block) {
    var comp = block && block.querySelector('[data-adapt-id]');
    return comp ? comp.getAttribute('data-adapt-id') : null;
  }

  function hide(blockId) {
    var el = document.querySelector('.' + blockId);
    if (el) { el.style.display = 'none'; }
  }

  function show(blockId) {
    var el = document.querySelector('.' + blockId);
    if (el) {
      el.style.display = 'block';
      if (visibleBlocks.indexOf(blockId) === -1)     visibleBlocks.push(blockId);
    }
  }

  function prune() {
    var c = document.querySelector('.block__container');
    if (!c) return;
    for (var i = 0; i < c.children.length; i++) {
      var child = c.children[i];
      var id = getBlockId(child);
      if (id && visibleBlocks.indexOf(id) === -1) {
        child.style.display = 'none';
      }
    }
  }

  function storeChoice(block) {
    var comp = block.querySelector('.component[data-adapt-id]');
    if (!comp) return;
    var compId = comp.getAttribute('data-adapt-id');
    var ans = ANSWERS[compId];
    if (!ans) return;
    var widget = block.querySelector('.mcq__widget');
    var items = block.querySelectorAll('.mcq-item');
    var selectedIdx = -1;
    items.forEach(function(item, i) {
      if (item.querySelector('.is-selected')) selectedIdx = i;
    });
    if (selectedIdx === -1) return;
    var isCorrect = selectedIdx === ans.correct_idx;
    var isPartial = widget && widget.classList.contains('is-partial');
    var choice = {
      block: getBlockId(block),
      question: ans.question,
      selected_idx: selectedIdx,
      selected_text: ans.items[selectedIdx].text,
      correct_idx: ans.correct_idx,
      correct_text: ans.items[ans.correct_idx].text,
      is_correct: isCorrect,
      is_partial: isPartial,
      feedback: ans.items[selectedIdx].feedback
    };
    choices.push(choice);

    // ── Send xAPI answered statement ──
    try {
      if (window.XAPI) {
        window.XAPI.sendAnswered(
          choice.question,
          choice.selected_idx,
          choice.correct_idx,
          choice.feedback,
          choice.is_correct
        );
        // Also send progress update
        var totalQ = Object.keys(ANSWERS).length;
        var answered = choices.length;
        window.XAPI.sendProgressed(answered / totalQ, choice.block);
      }
    } catch(e) {
      console.warn('[xAPI] Failed to send answered statement:', e);
    }
  }

  function renderSummary() {
    var container = document.getElementById('summary-container');
    if (!container || choices.length === 0) return;
    var correct = choices.filter(function(c) { return c.is_correct; }).length;
    var total = choices.length;

    // ── Send xAPI completion statements ──
    try {
      if (window.XAPI) {
        window.XAPI.sendCompleted(correct, total);
        window.XAPI.sendScored(correct, 0, total, total > 0 ? correct / total : 0);
      }
    } catch(e) {
      console.warn('[xAPI] Failed to send completion:', e);
    }
    var html = '<div class="summary-report">';
    html += '<div class="summary-header">';
    html += '<div class="summary-score">' + correct + ' / ' + total + '</div>';
    html += '<div class="summary-label">Decisions Correct</div>';
    html += '</div>';
    choices.forEach(function(c, i) {
      var isRight = c.is_correct;
      var cls = isRight ? 'is-correct' : (c.is_partial ? 'is-partial' : 'is-incorrect');
      html += '<div class="summary-row ' + cls + '">';
      html += '<div class="summary-step">Step ' + (i + 1) + '</div>';
      html += '<div class="summary-question">' + c.question + '</div>';
      html += '<div class="summary-choices">';
      html += '<div class="summary-choice is-user' + (isRight ? '' : ' is-incorrect-choice') + '">';
      html += '<div class="summary-choice-label ' + (isRight ? 'is-success' : 'is-error') + '">' + (isRight ? 'YOUR CHOICE' : 'YOUR CHOICE') + '</div>';
      html += '<div class="summary-choice-text">' + c.selected_text + '</div>';
      html += '</div>';
      if (!isRight) {
        html += '<div class="summary-choice is-best">';
        html += '<div class="summary-choice-label is-success">BEST CHOICE</div>';
        html += '<div class="summary-choice-text">' + c.correct_text + '</div>';
        html += '</div>';
      }
      html += '</div>';
      html += '<div class="summary-feedback"><strong>Why:</strong> ' + c.feedback + '</div>';
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function init() {
    var c = document.querySelector('.block__container');
    if (!c) { setTimeout(init, 200); return; }
    for (var i = 0; i < c.children.length; i++) {
      var id = getBlockId(c.children[i]);
      if (id && visibleBlocks.indexOf(id) === -1) {
        c.children[i].style.display = 'none';
      }
    }
  }

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.js-btn-action');
    if (!btn || btn.disabled) return;
    var block = btn.closest('.block');
    if (!block) return;
    var id = getBlockId(block);
    if (!id || !ROUTES[id]) return;
    setTimeout(function() {
      var widget = block.querySelector('.mcq__widget');
      if (!widget || !widget.classList.contains('is-submitted')) return;
      storeChoice(block);
      var ok = widget.classList.contains('is-correct');
      var partial = widget.classList.contains('is-partial');
      var nid = ok ? ROUTES[id].correct : (partial ? ROUTES[id].partly : ROUTES[id].incorrect);
      show(nid);
      prune();
      if (nid === 'b-007') {
        setTimeout(renderSummary, 500);
      }
    }, 800);
  });

  init();
})();
</script>
