<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="50%" stop-color="#141d2e"/>
      <stop offset="100%" stop-color="#0d1321"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d72c4"/>
      <stop offset="100%" stop-color="#2c5691"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a050"/>
      <stop offset="100%" stop-color="#d48740"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d72c4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0a050" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="20"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#3d72c4" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="650" y1="0" x2="650" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Ambient glow background -->
  <ellipse cx="400" cy="200" rx="300" ry="150" fill="url(#glow)" opacity="0.5"/>

  <!-- Learning nodes / branching network -->
  <!-- Central node -->
  <circle cx="400" cy="175" r="48" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="400" cy="175" r="42" fill="url(#accentGrad)" opacity="0.15"/>
  <circle cx="400" cy="175" r="6" fill="#f0a050" filter="url(#glowFilter)"/>

  <!-- Satellite nodes -->
  <circle cx="280" cy="110" r="4" fill="#3d72c4" opacity="0.7"/>
  <circle cx="520" cy="110" r="4" fill="#3d72c4" opacity="0.7"/>
  <circle cx="220" cy="200" r="4" fill="#3d72c4" opacity="0.7"/>
  <circle cx="580" cy="200" r="4" fill="#3d72c4" opacity="0.7"/>
  <circle cx="310" cy="270" r="4" fill="#3d72c4" opacity="0.7"/>
  <circle cx="490" cy="270" r="4" fill="#3d72c4" opacity="0.7"/>
  <circle cx="340" cy="80" r="3" fill="#f0a050" opacity="0.6"/>
  <circle cx="460" cy="80" r="3" fill="#f0a050" opacity="0.6"/>
  <circle cx="180" cy="150" r="3" fill="#f0a050" opacity="0.5"/>
  <circle cx="620" cy="150" r="3" fill="#f0a050" opacity="0.5"/>
  <circle cx="250" cy="250" r="3" fill="#3d72c4" opacity="0.5"/>
  <circle cx="550" cy="250" r="3" fill="#3d72c4" opacity="0.5"/>

  <!-- Connection paths -->
  <g stroke="#3d72c4" stroke-width="1.2" opacity="0.3" fill="none">
    <path d="M400,175 Q340,130 280,110"/>
    <path d="M400,175 Q460,130 520,110"/>
    <path d="M400,175 Q310,185 220,200"/>
    <path d="M400,175 Q490,185 580,200"/>
    <path d="M400,175 Q355,225 310,270"/>
    <path d="M400,175 Q445,225 490,270"/>
    <path d="M400,175 Q370,120 340,80"/>
    <path d="M400,175 Q430,120 460,80"/>
    <path d="M220,200 Q200,175 180,150"/>
    <path d="M580,200 Q600,175 620,150"/>
    <path d="M310,270 Q280,260 250,250"/>
    <path d="M490,270 Q520,260 550,250"/>
  </g>

  <!-- Concentric rings around central node -->
  <circle cx="400" cy="175" r="75" fill="none" stroke="#3d72c4" stroke-width="0.5" opacity="0.15"/>
  <circle cx="400" cy="175" r="110" fill="none" stroke="#3d72c4" stroke-width="0.3" opacity="0.1"/>
  <circle cx="400" cy="175" r="145" fill="none" stroke="#f0a050" stroke-width="0.3" opacity="0.08"/>

  <!-- Glassmorphism card -->
  <rect x="200" y="290" width="400" height="60" rx="12" fill="#1a2333" opacity="0.7" stroke="#3a4559" stroke-width="0.5"/>

  <!-- Title text -->
  <text x="400" y="310" text-anchor="middle" fill="#c8ccd4" font-family="Outfit, 'Segoe UI', sans-serif" font-size="11" font-weight="400" letter-spacing="4" opacity="0.7">LEARNING EXPERIENCE DESIGNER</text>

  <!-- Name -->
  <text x="400" y="338" text-anchor="middle" fill="#ececec" font-family="Outfit, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="6">PUNIT GANJARA</text>

  <!-- Subtitle glow -->
  <text x="400" y="338" text-anchor="middle" fill="#3d72c4" font-family="Outfit, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="6" opacity="0.3" filter="url(#softGlow)">PUNIT GANJARA</text>

  <!-- Accent line -->
  <line x1="360" y1="352" x2="440" y2="352" stroke="#f0a050" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- Corner decorative elements -->
  <path d="M30,30 L30,70 L34,70 L34,34 L70,34 L70,30 Z" fill="#3d72c4" opacity="0.3"/>
  <path d="M770,30 L770,70 L766,70 L766,34 L730,34 L730,30 Z" fill="#3d72c4" opacity="0.3"/>
  <path d="M30,370 L30,330 L34,330 L34,366 L70,366 L70,370 Z" fill="#3d72c4" opacity="0.3"/>
  <path d="M770,370 L770,330 L766,330 L766,366 L730,366 L730,370 Z" fill="#3d72c4" opacity="0.3"/>

  <!-- Small decorative dots -->
  <circle cx="120" cy="50" r="1.5" fill="#f0a050" opacity="0.3"/>
  <circle cx="680" cy="50" r="1.5" fill="#f0a050" opacity="0.3"/>
  <circle cx="120" cy="350" r="1.5" fill="#f0a050" opacity="0.3"/>
  <circle cx="680" cy="350" r="1.5" fill="#f0a050" opacity="0.3"/>

  <!-- SCORM / xAPI / H5P skill badges -->
  <g opacity="0.15">
    <rect x="64" y="185" width="48" height="18" rx="9" fill="none" stroke="#3d72c4" stroke-width="0.8"/>
    <text x="88" y="197" text-anchor="middle" fill="#3d72c4" font-family="monospace" font-size="8">SCORM</text>
    <rect x="688" y="185" width="48" height="18" rx="9" fill="none" stroke="#f0a050" stroke-width="0.8"/>
    <text x="712" y="197" text-anchor="middle" fill="#f0a050" font-family="monospace" font-size="8">xAPI</text>
    <rect x="64" y="210" width="48" height="18" rx="9" fill="none" stroke="#3d72c4" stroke-width="0.8"/>
    <text x="88" y="222" text-anchor="middle" fill="#3d72c4" font-family="monospace" font-size="8">H5P</text>
    <rect x="688" y="210" width="48" height="18" rx="9" fill="none" stroke="#f0a050" stroke-width="0.8"/>
    <text x="712" y="222" text-anchor="middle" fill="#f0a050" font-family="monospace" font-size="8">cmi5</text>
  </g>
</svg>
