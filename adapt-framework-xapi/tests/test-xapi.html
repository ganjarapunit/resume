<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xAPI Wrapper — End-to-End Tests</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #20457c;
      --primary-light: #3b6fb3;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f1f5f9;
      --card-bg: rgba(255,255,255,0.85);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); margin-bottom: 2rem; }

    /* Stats bar */
    .stats {
      display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;
    }
    .stat-card {
      flex: 1; min-width: 120px;
      background: var(--card-bg); backdrop-filter: blur(12px);
      border-radius: var(--radius); padding: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat-value { font-size: 2rem; font-weight: 700; }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card.pass .stat-value { color: var(--accent); }
    .stat-card.fail .stat-value { color: var(--danger); }
    .stat-card.warn .stat-value { color: var(--warning); }

    /* Verb test grid */
    .verb-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem; margin-bottom: 2rem;
    }
    .verb-card {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border-radius: 12px; padding: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      display: flex; align-items: center; gap: 0.5rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .verb-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .verb-card .icon { width: 20px; height: 20px; flex-shrink: 0; }
    .verb-card .name { font-weight: 500; font-size: 0.9rem; }
    .verb-card.pending { border-left: 3px solid var(--text-muted); opacity: 0.5; }
    .verb-card.running { border-left: 3px solid var(--primary-light); }
    .verb-card.pass { border-left: 3px solid var(--accent); }
    .verb-card.fail { border-left: 3px solid var(--danger); }

    /* Detail log */
    .log-panel {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border-radius: var(--radius); padding: 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 2rem;
    }
    .log-panel h3 { font-size: 1rem; margin-bottom: 0.75rem; }
    .log-entry {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.8rem; padding: 0.35rem 0.5rem;
      border-radius: 6px; margin-bottom: 0.25rem;
      background: rgba(0,0,0,0.03);
      word-break: break-all;
    }
    .log-entry.error { background: rgba(239,68,68,0.08); color: var(--danger); }
    .log-entry.success { background: rgba(16,185,129,0.08); color: var(--accent); }
    .log-entry.info { color: var(--text-muted); }

    /* Statement inspector */
    .stmt-inspector {
      background: #1e293b; color: #e2e8f0;
      border-radius: var(--radius); padding: 1rem;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.75rem; white-space: pre-wrap; overflow-x: auto;
      max-height: 300px; overflow-y: auto;
      margin-bottom: 1rem;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.25rem; border-radius: 10px; border: none;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: rgba(0,0,0,0.06); color: var(--text); }
    .btn-secondary:hover { background: rgba(0,0,0,0.1); }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="container">
  <h1>xAPI Wrapper E2E Tests</h1>
  <p class="subtitle">Validates all verbs, statement structure, and LRS payloads</p>

  <div class="stats">
    <div class="stat-card" id="stat-total"><div class="stat-value">—</div><div class="stat-label">Total Verbs</div></div>
    <div class="stat-card pass" id="stat-pass"><div class="stat-value">—</div><div class="stat-label">Passed</div></div>
    <div class="stat-card fail" id="stat-fail"><div class="stat-value">—</div><div class="stat-label">Failed</div></div>
    <div class="stat-card warn" id="stat-sent"><div class="stat-value">—</div><div class="stat-label">Statements Sent</div></div>
  </div>

  <div class="verb-grid" id="verb-grid"></div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-run" onclick="runTests()"><i data-lucide="play"></i> Run All Tests</button>
    <button class="btn btn-secondary" id="btn-clear" onclick="clearResults()"><i data-lucide="trash-2"></i> Clear</button>
  </div>

  <div class="log-panel" id="log-panel" style="margin-top:1.5rem;">
    <h3>Statement Log</h3>
    <div id="log-entries"><span class="log-entry info">Waiting to run tests...</span></div>
  </div>

  <details style="margin-top:1rem;">
    <summary style="cursor:pointer; font-weight:600; font-size:0.9rem;">Last Captured Statement (JSON)</summary>
    <div class="stmt-inspector" id="stmt-json">—</div>
  </details>
</div>

<script>
  'use strict';

  // ── Mock XMLHttpRequest ──
  var capturedStatements = [];
  var _OriginalXHR = window.XMLHttpRequest;

  window.XMLHttpRequest = function() {
    var xhr = new _OriginalXHR();
    var _open = xhr.open;
    var _send = xhr.send;

    xhr.open = function(method, url, async) {
      xhr._method = method;
      xhr._url = url;
      xhr._headers = {};
      return _open.apply(xhr, arguments);
    };

    xhr.setRequestHeader = function(name, value) {
      xhr._headers[name] = value;
      return _OriginalXHR.prototype.setRequestHeader.apply(xhr, arguments);
    };

    xhr.send = function(body) {
      try {
        var stmts = JSON.parse(body);
        capturedStatements.push({
          method: xhr._method,
          url: xhr._url,
          headers: Object.assign({}, xhr._headers),
          statements: stmts,
          timestamp: new Date().toISOString()
        });
        // Simulate successful LRS response
        setTimeout(function() {
          if (xhr.onload) {
            Object.defineProperty(xhr, 'status', { value: 200 });
            xhr.onload();
          }
        }, 10);
      } catch(e) {
        capturedStatements.push({ error: e.message, body: body });
        if (xhr.onerror) xhr.onerror();
      }
    };

    return xhr;
  };
  window.XMLHttpRequest.prototype = _OriginalXHR.prototype;

  // Clear localStorage for clean test
  localStorage.removeItem('learnerName');
</script>

<!-- Load the wrapper under test -->
<script src="../xapi-wrapper.js"></script>

<script>
  'use strict';

  // Verbs expected to be in the wrapper (matching VERBS map)
  var EXPECTED_VERBS = [
    'attempted','initialized','initialised','launched','completed','answered',
    'interacted','progressed','terminated','passed','failed','suspended',
    'viewed','watched','experienced','skipped','unlocked','rated','shared',
    'loggedin','loggedout','registered','joined','submitted','downloaded',
    'uploaded','created','deleted','assigned','accessed','exited',
    'mastered','satisfied','scored','imported','preferred'
  ];

  var results = {};   // { verbKey: 'pending'|'pass'|'fail' }
  var logEntries = [];

  function log(msg, cls) {
    logEntries.push({ text: msg, cls: cls || 'info' });
    renderLog();
    renderStats();
  }

  function renderLog() {
    var el = document.getElementById('log-entries');
    el.innerHTML = logEntries.slice(-30).map(function(e) {
      return '<div class="log-entry ' + (e.cls||'') + '">' + e.text + '</div>';
    }).join('');
  }

  function renderStats() {
    var total = EXPECTED_VERBS.length;
    var pass = Object.values(results).filter(function(v){ return v==='pass'; }).length;
    var fail = Object.values(results).filter(function(v){ return v==='fail'; }).length;
    document.getElementById('stat-total').querySelector('.stat-value').textContent = total;
    document.getElementById('stat-pass').querySelector('.stat-value').textContent = pass;
    document.getElementById('stat-fail').querySelector('.stat-value').textContent = fail;
    document.getElementById('stat-sent').querySelector('.stat-value').textContent = capturedStatements.length;
  }

  function setVerbStatus(verb, status) {
    results[verb] = status;
    var card = document.querySelector('.verb-card[data-verb="' + verb + '"]');
    if (card) {
      card.className = 'verb-card ' + status;
    }
    renderStats();
  }

  function buildVerbGrid() {
    var grid = document.getElementById('verb-grid');
    grid.innerHTML = EXPECTED_VERBS.map(function(v) {
      return '<div class="verb-card pending" data-verb="' + v + '">' +
             '<span class="name">' + v + '</span></div>';
    }).join('');
  }

  function clearResults() {
    capturedStatements = [];
    results = {};
    logEntries = [];
    document.getElementById('log-entries').innerHTML = '<span class="log-entry info">Cleared. Ready to run.</span>';
    document.getElementById('stmt-json').textContent = '—';
    buildVerbGrid();
    renderStats();
  }

  // ── Validation helpers ──
  function validateStatement(stmt, expectedVerbIri) {
    var errors = [];
    if (!stmt.actor) errors.push('missing actor');
    else if (!stmt.actor.objectType) errors.push('actor missing objectType');
    if (!stmt.verb) errors.push('missing verb');
    else if (stmt.verb.id !== expectedVerbIri) errors.push('verb IRI mismatch: expected ' + expectedVerbIri + ', got ' + stmt.verb.id);
    if (!stmt.object) errors.push('missing object');
    else if (stmt.object.objectType !== 'Activity') errors.push('object not Activity type');
    if (!stmt.timestamp) errors.push('missing timestamp');
    if (!stmt.context) errors.push('missing context');
    return errors;
  }

  function runTests() {
    // Reset
    capturedStatements = [];
    results = {};
    logEntries = [];
    buildVerbGrid();
    renderLog();

    log('Starting xAPI wrapper end-to-end tests...', 'info');
    log('Mock LRS endpoint: ' + capturedStatements.length + ' statements captured so far', 'info');

    // Test each verb via xapiTrack
    var tested = 0;
    var total = EXPECTED_VERBS.length;
    var verbIriMap = {}; // populated from captured statements

    EXPECTED_VERBS.forEach(function(verbKey, idx) {
      setVerbStatus(verbKey, 'running');

      // Call xapiTrack (must be available globally)
      if (typeof window.xapiTrack !== 'function') {
        log('FAIL: window.xapiTrack is not a function!', 'error');
        setVerbStatus(verbKey, 'fail');
        tested++;
        return;
      }

      window.xapiTrack(verbKey, {
        result: {
          score: { scaled: 1, raw: 1, min: 0, max: 1 },
          success: true,
          completion: true,
          response: 'test-' + verbKey
        }
      }, function(err, status) {
        if (err) {
          log('FAIL [' + verbKey + ']: ' + err, 'error');
          setVerbStatus(verbKey, 'fail');
        } else {
          log('OK [' + verbKey + '] — LRS responded ' + status, 'success');
          setVerbStatus(verbKey, 'pass');
        }
        tested++;
        if (tested >= total) {
          finishTests();
        }
      });
    });

    // If xapiTrack is sync (which it is — queueOrSend is sync), callbacks fire immediately
    // But there might be async XHR mock delay. Use setTimeout fallback.
    setTimeout(function() {
      if (tested < total) {
        log('(some callbacks still pending, waiting...)', 'info');
      }
    }, 500);
  }

  function finishTests() {
    log('─── All verb tests complete ───', 'info');
    log('Total statements captured: ' + capturedStatements.length, 'info');

    // Structural validation on captured statements
    var structuralErrors = 0;
    capturedStatements.forEach(function(cap, i) {
      if (cap.statements && cap.statements.length > 0) {
        cap.statements.forEach(function(stmt) {
          var errs = validateStatement(stmt, stmt.verb.id);
          if (errs.length > 0) {
            log('STRUCT [' + i + '] ' + (stmt.verb.display ? stmt.verb.display['en-US'] : '?') + ': ' + errs.join(', '), 'error');
            structuralErrors++;
          }
        });
      }
    });

    if (structuralErrors === 0) {
      log('All captured statements pass structural validation ✓', 'success');
    }

    // Show last statement JSON
    if (capturedStatements.length > 0) {
      var last = capturedStatements[capturedStatements.length - 1];
      document.getElementById('stmt-json').textContent = JSON.stringify(last, null, 2);
    }

    // Check that 'attempted' was sent automatically by onReady
    var hasAttempted = capturedStatements.some(function(c) {
      return c.statements && c.statements.some(function(s) {
        return s.verb.id.indexOf('attempted') > -1;
      });
    });
    log(hasAttempted ? 'Auto attempted statement: DETECTED ✓' : 'Auto attempted statement: MISSING ✗', hasAttempted ? 'success' : 'error');

    renderStats();
    lucide.createIcons();
  }

  // ── Init ──
  buildVerbGrid();
  renderStats();

  // Auto-run on page load after short delay to let wrapper initialize
  window.addEventListener('load', function() {
    setTimeout(function() {
      log('Wrapper loaded. ' + capturedStatements.length + ' auto-statements captured.', 'info');
      lucide.createIcons();
    }, 300);
  });

</script>
</body>
</html>
