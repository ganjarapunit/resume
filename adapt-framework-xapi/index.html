<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adapt Framework xAPI Course | Punit Ganjara</title>
<meta name="description" content="SCORM 2004 + xAPI course built with Adapt Framework — responsive, accessible, and LMS-ready.">
<link rel="canonical" href="https://ganjarapunit.github.io/resume/adapt-framework-xapi/">
<script>
  window.ADAPT_BUILD_TYPE = 'production';
  window.ISCOOKIELMS = false;
</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link href="adapt.css?timestamp=1781941097532" type="text/css" rel="stylesheet">
<script src="libraries/modernizr.js"></script>
<script src="xapi-wrapper.js"></script>
<script src="adapt/js/scriptLoader.js"></script>
<style>
/* Back-to-portfolio bar */
.back-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.45);
  padding: 8px 24px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'Outfit', sans-serif;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fbbf24; color: #1e293b !important; text-decoration: none;
  font-size: .82rem; font-weight: 700;
  padding: 7px 14px; border-radius: 8px;
  border: 2px solid #d97706; transition: all .25s ease;
  font-family: 'Outfit', sans-serif;
}
.back-btn:hover { background: #f59e0b; border-color: #b45309; transform: translateX(-3px); }
.back-btn svg { width: 15px; height: 15px; }
.course-badge {
  font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  color: #4a5568; background: rgba(32,69,124,.06);
  padding: 4px 12px; border-radius: 99px;
  font-family: 'Outfit', sans-serif;
}
.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.12);
  background: rgba(0,0,0,0.06); color: #475569;
  cursor: pointer; transition: all .25s ease;
}
.theme-toggle:hover { background: rgba(0,0,0,0.1); transform: scale(1.05); }
.theme-toggle svg { width: 16px; height: 16px; }
/* Push Adapt content below back-bar */
#app { padding-top: 50px; }
/* Dark theme compat */
[data-theme="dark"] .back-bar { background: rgba(15,23,42,0.9); border-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .course-badge { color: #fbbf24; background: rgba(251,191,36,0.1); }
[data-theme="dark"] .theme-toggle { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; }
[data-theme="dark"] .theme-toggle:hover { background: rgba(255,255,255,0.2); }
[data-theme="dark"] .back-btn { background: #fbbf24; color: #1e293b !important; border-color: #d97706; }
[data-theme="dark"] .back-btn:hover { background: #f59e0b; border-color: #b45309; }
</style>
</head>
<body>
<div class="back-bar">
  <a href="../" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Back to Portfolio
  </a>
  <span class="course-badge">ADAPT FRAMEWORK · xAPI</span>
  <button class="theme-toggle" onclick="toggleCourseTheme()" aria-label="Toggle dark mode">
    <i data-lucide="moon" id="courseThemeIcon"></i>
  </button>
</div>
<div id="app">
  <div id="wrapper"></div>
</div>
<script>
lucide.createIcons();

function toggleCourseTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('courseThemeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
  lucide.createIcons();
}

(function initCourseTheme() {
  var saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
</body>
</html>
