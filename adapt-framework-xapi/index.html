<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Adapt Framework xAPI Course | Punit Ganjara</title>

<script>
  window.ADAPT_BUILD_TYPE = 'production';
  window.ISCOOKIELMS = false;
</script>
<!-- CRITICAL: Alert interception + Theme init — must run BEFORE Adapt scripts -->
<script>
(function() {
  /* ── Theme init (runs before any rendering) ── */
  var saved = localStorage.getItem('theme');
  if (saved) { document.documentElement.setAttribute('data-theme', saved); }
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  /* ── Modal helpers (called by alert/confirm overrides, defined early) ── */
  window.showCustomModal = function(title, message, isError) {
    var modal = document.getElementById('customModal');
    if (!modal) { console.warn('[Modal not ready]', title, message); return; }
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    var cancelBtn = document.querySelector('.custom-modal-btn-secondary');
    if (cancelBtn) cancelBtn.style.display = isError ? 'none' : 'block';
    modal.classList.add('active');
  };
  window.closeModal = function() {
    var m = document.getElementById('customModal');
    if (m) m.classList.remove('active');
  };

  /* ── Alert/Confirm override ── */
  var origAlert = window.alert;
  var origConfirm = window.confirm;
  window.alert = function(msg) {
    if (typeof msg === 'string' && msg.indexOf('not connected to the Learning Management System') !== -1) {
      console.warn('[LMS] Connection error suppressed (standalone mode)');
      return;
    }
    window.showCustomModal('Notification', String(msg));
  };
  window.confirm = function(msg) {
    if (typeof msg === 'string' && msg.indexOf('not connected') !== -1) {
      console.warn('[LMS] Confirm suppressed (standalone mode)');
      return true;
    }
    return true;
  };

  /* ── Theme toggle (needs to be global for onclick) ── */
  window.toggleCourseTheme = function() {
    var html = document.documentElement;
    var isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    var icon = document.getElementById('courseThemeIcon');
    if (icon) {
      icon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
      if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
    }
  };
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link href="adapt.css?timestamp=1781941097532" type="text/css" rel="stylesheet">

<style>
/* Back-to-portfolio bar */
.back-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.45);
  padding: 8px 24px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'Outfit', sans-serif;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fbbf24; color: #1e293b !important; text-decoration: none;
  font-size: .82rem; font-weight: 700;
  padding: 7px 14px; border-radius: 8px;
  border: 2px solid #d97706; transition: all .25s ease;
  font-family: 'Outfit', sans-serif;
}
.back-btn:hover { background: #f59e0b; border-color: #b45309; transform: translateX(-3px); }
.back-btn svg { width: 15px; height: 15px; }
.course-badge {
  font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  color: #4a5568; background: rgba(32,69,124,.06);
  padding: 4px 12px; border-radius: 99px;
  font-family: 'Outfit', sans-serif;
}
.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.12);
  background: rgba(0,0,0,0.06); color: #475569;
  cursor: pointer; transition: all .25s ease;
}
.theme-toggle:hover { background: rgba(0,0,0,0.1); transform: scale(1.05); }
.theme-toggle svg { width: 16px; height: 16px; }
/* Push Adapt content below back-bar */
#app { padding-top: 50px; }
/* Dark theme compat */
[data-theme="dark"] .back-bar { background: rgba(15,23,42,0.9); border-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .course-badge { color: #fbbf24; background: rgba(251,191,36,0.1); }
[data-theme="dark"] .theme-toggle { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; }
[data-theme="dark"] .theme-toggle:hover { background: rgba(255,255,255,0.2); }
[data-theme="dark"] .back-btn { background: #fbbf24; color: #1e293b !important; border-color: #d97706; }
[data-theme="dark"] .back-btn:hover { background: #f59e0b; border-color: #b45309; }

/* ── CUSTOM MODAL ── */
.custom-modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 10000; font-family: 'Outfit', sans-serif;
}
.custom-modal-overlay.active { display: flex; }
.custom-modal {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  border-radius: 16px; padding: 32px; max-width: 400px; width: 90%;
  text-align: center; position: relative;
}
[data-theme="dark"] .custom-modal {
  background: rgba(30, 41, 59, 0.85);
  border-color: rgba(255, 255, 255, 0.1);
  color: #f8fafc;
}
.custom-modal h3 { margin-top: 0; font-size: 1.25rem; font-weight: 700; color: #1e293b; }
[data-theme="dark"] .custom-modal h3 { color: #f8fafc; }
.custom-modal p { font-size: 0.95rem; line-height: 1.6; color: #475569; margin: 16px 0 24px; }
[data-theme="dark"] .custom-modal p { color: #cbd5e1; }
.custom-modal-actions { display: flex; gap: 12px; justify-content: center; }
.custom-modal-btn {
  padding: 10px 24px; border-radius: 8px; font-weight: 600;
  cursor: pointer; transition: all 0.2s ease; border: none; font-family: 'Outfit', sans-serif;
}
.custom-modal-btn-primary { background: #fbbf24; color: #1e293b; }
.custom-modal-btn-primary:hover { background: #f59e0b; }
.custom-modal-btn-secondary { background: rgba(0,0,0,0.05); color: #475569; }
[data-theme="dark"] .custom-modal-btn-secondary { background: rgba(255,255,255,0.1); color: #f1f5f9; }
.custom-modal-btn-secondary:hover { background: rgba(0,0,0,0.1); }

/* ── ADAPT THEME OVERRIDES ── */
[data-theme="dark"] #wrapper, 
[data-theme="dark"] #app,
[data-theme="dark"] .adapt-container {
  background-color: #0f172a !important;
  color: #f8fafc !important;
}
[data-theme="dark"] .adapt-text,
[data-theme="dark"] .adapt-title,
[data-theme="dark"] .adapt-description,
[data-theme="dark"] .adapt-content {
  color: #f8fafc !important;
}
[data-theme="dark"] .adapt-component {
  background-color: rgba(255,255,255,0.05) !important;
}
</style>
</head>
<body>
<div class="back-bar">
  <a href="../" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Back to Portfolio
  </a>
  <span class="course-badge">ADAPT FRAMEWORK · xAPI</span>
  <button class="theme-toggle" onclick="toggleCourseTheme()" aria-label="Toggle dark mode">
    <i data-lucide="moon" id="courseThemeIcon"></i>
  </button>
</div>
<div id="app">
  <div id="wrapper"></div>
</div>
<div id="customModal" class="custom-modal-overlay">
  <div class="custom-modal">
    <h3 id="modalTitle">Notification</h3>
    <p id="modalMessage"></p>
    <div class="custom-modal-actions">
      <button class="custom-modal-btn custom-modal-btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="custom-modal-btn custom-modal-btn-primary" id="modalOkBtn" onclick="closeModal()">OK</button>
    </div>
  </div>
</div>

<script>
lucide.createIcons();
</script>
</body>
