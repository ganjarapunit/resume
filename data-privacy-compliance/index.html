<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Privacy: Handle with Care</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#20457c;--primary-light:#3b6fb3;--primary-dark:#162f56;--accent:#10b981;--accent-light:#34d399;--success:#38a169;--success-bg:#f0fff4;--success-border:#c6f6d5;--danger:#e53e3e;--danger-bg:#fff5f5;--danger-border:#fed7d7;--warning:#d69e2e;--warning-bg:#fffff0;--warning-border:#fefcbf;--neutral:#718096;--bg:#f1f5f9;--card-bg:#ffffff;--text:#0f172a;--text-secondary:#4a5568;--text-muted:#64748b;--glass-border:rgba(255,255,255,0.45);--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.12);--radius:12px;--radius-sm:8px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
#app{max-width:860px;margin:0 auto;padding:88px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:0 0 var(--radius) var(--radius);padding:24px 32px 20px;margin:0 -20px;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
header::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,0.05),transparent);border-radius:50%}
header::after{content:'';position:absolute;bottom:-30%;left:10%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,0.03),transparent);border-radius:50%}
.header-inner{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.header-left{flex:1}
.course-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.3px;line-height:1.3}
.course-subtitle{font-size:13px;color:rgba(255,255,255,0.7);font-weight:400;margin-top:2px}
.step-indicator{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:0.3px;border:1px solid rgba(255,255,255,0.1)}
.progress-track{height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin-top:16px;overflow:hidden;position:relative;z-index:1}
.progress-bar{height:100%;background:linear-gradient(90deg,#63b3ed,#90cdf4);border-radius:2px;width:0%;transition:width 0.6s cubic-bezier(0.4,0,0.2,1)}
.scene{flex:1;margin-top:24px;opacity:0;transform:translateY(12px);transition:opacity 0.4s ease,transform 0.4s ease}
.scene.visible{opacity:1;transform:translateY(0)}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:32px;margin-bottom:20px;border:1px solid rgba(0,0,0,0.04)}
.scene-heading{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:16px;letter-spacing:-0.3px;line-height:1.3}
.scene-story{font-size:15px;color:var(--text-secondary);line-height:1.7;margin-bottom:24px}
.scene-story p{margin-bottom:12px}
.scene-story p:last-child{margin-bottom:0}
.choice-btn{display:block;width:100%;padding:16px 20px;margin-bottom:12px;background:var(--card-bg);border:2px solid #e2e8f0;border-radius:var(--radius-sm);cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;color:var(--text);text-align:left;transition:var(--transition);position:relative;overflow:hidden}
.choice-btn:hover:not(:disabled){border-color:var(--primary-light);background:#f7fafc;transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.choice-btn:active:not(:disabled){transform:translateY(0)}
.choice-btn:disabled{cursor:not-allowed;opacity:0.7}
.choice-btn .choice-icon{display:inline-block;width:28px;height:28px;border-radius:50%;border:2px solid #e2e8f0;text-align:center;line-height:24px;font-size:13px;font-weight:700;color:var(--text-muted);margin-right:12px;transition:var(--transition);flex-shrink:0}
.choice-btn:hover:not(:disabled) .choice-icon{border-color:var(--primary-light);color:var(--primary-light)}
.choice-btn .choice-text{flex:1}
.choice-btn .choice-label{display:inline-flex;align-items:center;gap:12px;width:100%}
.choice-btn.selected-correct{border-color:var(--success);background:var(--success-bg)}
.choice-btn.selected-correct .choice-icon{border-color:var(--success);background:var(--success);color:#fff}
.choice-btn.selected-incorrect{border-color:var(--danger);background:var(--danger-bg)}
.choice-btn.selected-incorrect .choice-icon{border-color:var(--danger);background:var(--danger);color:#fff}
.choice-btn.selected-neutral{border-color:var(--warning);background:var(--warning-bg)}
.choice-btn.selected-neutral .choice-icon{border-color:var(--warning);background:var(--warning);color:#fff}
.email-wrapper{margin-bottom:24px;border:1px solid #e2e8f0;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-sm)}
.email-bar{background:#f8fafc;padding:10px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px}
.email-dot{width:10px;height:10px;border-radius:50%}
.email-dot.red{background:#fc8181}
.email-dot.yellow{background:#f6e05e}
.email-dot.green{background:#68d391}
.email-field{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:13px;color:var(--text-secondary);display:flex}
.email-field:last-of-type{border-bottom:1px solid #e2e8f0}
.email-label{font-weight:600;color:var(--text);min-width:60px;flex-shrink:0}
.email-value{color:var(--text-secondary)}
.email-value.urgent{color:var(--danger);font-weight:600}
.email-body{padding:16px;font-size:14px;color:var(--text-secondary);line-height:1.7;background:#fff}
.email-body p{margin-bottom:10px}
.email-body p:last-child{margin-bottom:0}
.email-body .email-signature{margin-top:12px;color:var(--text-muted)}
.feedback-panel{margin-top:20px;padding:20px;border-radius:var(--radius-sm);animation:fadeSlideIn 0.3s ease}
.feedback-panel.positive{background:var(--success-bg);border:1px solid var(--success-border)}
.feedback-panel.negative{background:var(--danger-bg);border:1px solid var(--danger-border)}
.feedback-panel.neutral{background:var(--warning-bg);border:1px solid var(--warning-border)}
.feedback-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.feedback-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.feedback-icon.check{background:var(--success);color:#fff}
.feedback-icon.x{background:var(--danger);color:#fff}
.feedback-icon.warning{background:var(--warning);color:#fff}
.feedback-title{font-weight:600;font-size:15px}
.feedback-title.positive-text{color:var(--success)}
.feedback-title.negative-text{color:var(--danger)}
.feedback-title.neutral-text{color:var(--warning)}
.feedback-text{font-size:14px;color:var(--text-secondary);line-height:1.6}
.tip-box{margin-top:16px;padding:16px;background:rgba(59,130,246,0.06);border-radius:var(--radius-sm);border-left:3px solid var(--primary-light)}
.tip-box .tip-label{font-size:12px;font-weight:700;color:var(--primary-light);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.tip-box .tip-text{font-size:13px;color:var(--text-secondary);line-height:1.6}
.continue-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:12px 28px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition)}
.continue-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,54,93,0.3)}
.continue-btn .arrow{transition:transform 0.2s ease}
.continue-btn:hover .arrow{transform:translateX(3px)}
.outcome-screen{text-align:center;padding:20px 0}
.outcome-badge{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px;box-shadow:var(--shadow-md)}
.outcome-badge.hero{background:var(--success-bg);border:3px solid var(--success)}
.outcome-badge.close-call{background:var(--warning-bg);border:3px solid var(--warning)}
.outcome-badge.breach{background:var(--danger-bg);border:3px solid var(--danger)}
.outcome-title{font-size:28px;font-weight:800;margin-bottom:4px;letter-spacing:-0.5px}
.outcome-title.hero{color:var(--success)}
.outcome-title.close-call{color:var(--warning)}
.outcome-title.breach{color:var(--danger)}
.outcome-subtitle{font-size:15px;color:var(--text-secondary);margin-bottom:24px}
.score-display{display:flex;justify-content:center;gap:32px;margin-bottom:28px;flex-wrap:wrap}
.score-item{text-align:center}
.score-value{font-size:36px;font-weight:800;line-height:1}
.score-value.hero{color:var(--success)}
.score-value.close-call{color:var(--warning)}
.score-value.breach{color:var(--danger)}
.score-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-top:4px}
.outcome-details{background:#f8fafc;border-radius:var(--radius-sm);padding:20px;margin-bottom:20px;text-align:left}
.outcome-details h4{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px}
.outcome-details ul{list-style:none;padding:0}
.outcome-details li{padding:6px 0;font-size:14px;color:var(--text-secondary);display:flex;align-items:flex-start;gap:8px}
.outcome-details li::before{content:'✓';color:var(--success);font-weight:700;flex-shrink:0}
.lessons-box{background:rgba(59,130,246,0.05);border-radius:var(--radius-sm);padding:20px;margin-bottom:24px;text-align:left;border:1px solid rgba(59,130,246,0.1)}
.lessons-box h4{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.lessons-box ul{list-style:none;padding:0}
.lessons-box li{padding:6px 0;font-size:14px;color:var(--text-secondary);display:flex;align-items:flex-start;gap:8px}
.lessons-box li::before{content:'→';color:var(--primary-light);font-weight:700;flex-shrink:0}
.retry-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:var(--transition)}
.retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(32,69,124,0.3)}
.btn-row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 28px;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:none;text-decoration:none
}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 12px rgba(32,69,124,.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(32,69,124,.3)}
.btn-secondary{background:white;color:var(--primary);border:1px solid var(--glass-border);box-shadow:var(--shadow-sm)}
.btn-secondary:hover{background:rgba(32,69,124,.06);transform:translateY(-2px)}
.btn-success{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.25)}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,.3)}
.btn-block{width:100%;justify-content:center}
.intro-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.intro-badge span{background:rgba(26,54,93,0.08);padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600;color:var(--primary);letter-spacing:0.3px}
.scenario-setup{background:#f8fafc;border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:20px;border-left:3px solid var(--primary-light)}
.scenario-setup p{font-size:14px;color:var(--text-secondary);line-height:1.6}
.scenario-setup strong{color:var(--text)}
.consequences{margin-top:16px;padding:16px;border-radius:var(--radius-sm);font-size:14px;line-height:1.6}
a{color:var(--primary-light);text-decoration:none}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.scene.visible .card{animation:slideUp 0.4s ease forwards}
.scene.visible .card:nth-child(2){animation-delay:0.1s}
.back-bar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,0.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.45);padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between
}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--primary);text-decoration:none;font-size:.85rem;font-weight:600;
  padding:8px 16px;border-radius:var(--radius-sm);transition:all .25s ease
}
.back-btn:hover{background:rgba(32,69,124,.08);transform:translateX(-3px)}
.back-btn svg{width:16px;height:16px}
@media(max-width:640px){
  #app{padding:88px 12px 32px}
  .back-bar{padding:8px 12px}
  header{padding:18px 20px 16px;border-radius:0;margin:0 -12px}
  .course-title{font-size:17px}
  .card{padding:20px}
  .scene-heading{font-size:19px}
  .choice-btn{padding:14px 16px;font-size:13px}
  .email-field{font-size:12px}
  .outcome-title{font-size:24px}
  .score-display{gap:20px}
  .score-value{font-size:30px}
  .header-inner{flex-direction:column;gap:10px}
  .step-indicator{align-self:flex-start}
}
@media(max-width:400px){
  .choice-btn .choice-label{gap:8px}
  .choice-btn .choice-icon{width:24px;height:24px;line-height:20px;font-size:11px;margin-right:8px}
  .choice-btn{padding:12px 12px;font-size:12px}
}
.learner-banner{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--primary);color:#fff;padding:6px 24px;font-size:.78rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.learner-banner span{opacity:.9}
.learner-banner a{color:#fff;text-decoration:underline;cursor:pointer;font-weight:600}
.learner-banner a:hover{opacity:.8}
.name-form{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.name-form input{flex:1;min-width:160px;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:.85rem;outline:none;transition:border-color .25s ease;background:#fff}
.name-form input:focus{border-color:var(--primary)}
.name-form button{padding:10px 22px;border:none;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;transition:opacity .25s ease;white-space:nowrap}
.name-form button:hover{opacity:.88}
.name-form .skip-link{background:none;border:none;color:var(--text-muted);font-family:'Outfit',sans-serif;font-size:.82rem;cursor:pointer;text-decoration:underline;padding:10px 8px}
.name-form .skip-link:hover{color:var(--text)}
.course-badge{
  font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--text-muted);background:rgba(32,69,124,.06);padding:4px 12px;border-radius:99px
}
</style>
</head>
<body>
<div id="learnerBanner" class="learner-banner"></div>
  <div id="nameFormBox" style="background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(32,69,124,.06));border:1px dashed var(--primary-light);border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:24px;display:none">
    <div style="font-size:.82rem;font-weight:600;color:var(--primary);margin-bottom:4px">👤 Who's taking this course?</div>
    <div style="font-size:.77rem;color:var(--text-muted);margin-bottom:10px">Your name will appear in xAPI tracking statements sent to the LRS.</div>
    <div class="name-form" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="learnerName" type="text" placeholder="Your name (e.g. Jane Doe)" autocomplete="name" style="flex:1;min-width:160px">
      <button onclick="setLearnerName()">Save Name</button>
      <button class="skip-link" onclick="skipLearnerName()">Continue anonymously</button>
    </div>
  </div>
  <button id="startBtn" onclick="startScenario()" style="display:none; width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; font-family:'Outfit',sans-serif; font-size:15px; transition:all 0.2s ease">
    Start Scenario <i data-lucide="arrow-right" style="width:16px;height:16px;margin-left:8px"></i>
  </button>
<div class="back-bar">
  <a href="../" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to Portfolio</a>
  <span class="course-badge">DATA PRIVACY</span>
</div>
<div id="app">
  <header>
    <div class="header-inner">
      <div class="header-left">
        <div class="course-title">Data Privacy: Handle with Care</div>
        <div class="course-subtitle">Interactive Branching Scenario</div>
      </div>
      <div id="stepIndicator" class="step-indicator">Start</div>
    </div>
    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </header>
  <main id="scene" class="scene"></main>
</div>
<script>
/* ==============================
   Learner Identity Management
   ============================== */
function generateId(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:r&3|8;return v.toString(16);}); }
function getVisitorId(){
  var id = localStorage.getItem('xapi_visitor_id');
  if(!id){ id = generateId(); localStorage.setItem('xapi_visitor_id', id); }
  return id;
}
function getLearnerName(){ return sessionStorage.getItem('xapi_learner_name') || ''; }
function setLearnerName(){
  try {
    var name = document.getElementById('learnerName').value.trim();
    console.log('[DP] setLearnerName called, name="'+name+'"');
    if(!name) return;
    sessionStorage.setItem('xapi_learner_name', name);
    console.log('[DP] Name saved to sessionStorage');
    var fb = document.getElementById('nameFormBox');
    if(fb) fb.style.display = 'none';
    updateBanner();
    var banner = document.getElementById('learnerBanner');
    if(banner){
      var flash = document.createElement('span');
      flash.textContent = ' ✓ Saved';
      flash.style.cssText = 'color:#38a169;font-weight:700;font-size:.75rem;margin-left:4px';
      banner.querySelector('span').appendChild(flash);
      setTimeout(function(){ if(flash.parentNode) flash.remove(); }, 2500);
    }
  } catch(e) { console.error('[DP] setLearnerName ERROR:', e); }
}
function skipLearnerName(){
  sessionStorage.setItem('xapi_learner_skipped', '1');
  var fb = document.getElementById('nameFormBox');
  if(fb) fb.style.display = 'none';
  updateBanner();
  console.log('[DP] Learner skipped name entry');
}
function resolveActor(){
  var name = getLearnerName();
  var vid = getVisitorId();
  if(name) return {account:{homePage:'https://ganjarapunit.github.io/resume', name:vid}, name:name, objectType:'Agent'};
  return {account:{homePage:'https://ganjarapunit.github.io/resume', name:vid}, name:'Learner-'+vid.slice(0,8), objectType:'Agent'};
}
function updateBanner(){
  var banner = document.getElementById('learnerBanner');
  if(!banner) return;
  var name = getLearnerName() || 'Learner-'+getVisitorId().slice(0,8);
  banner.innerHTML = '<span>Tracked as: <strong>' + name + '</strong></span>'
    + '<span style="display:flex;align-items:center;gap:8px">'
    + '<button onclick="showNameForm()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:3px 12px;font-family:\'Outfit\',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer">Not you?</button>'
    + '</span>';
}
function showNameForm(){
  document.getElementById('nameFormBox').style.display = 'block';
  var input = document.getElementById('learnerName');
  if(input){ input.value = ''; input.focus(); }
}
function startScenario(){
  try {
    console.log('[DP] startScenario() called');
    // Grab name from input if the user typed one but didn't click "Save Name"
    var nameInput = document.getElementById('learnerName');
    if(nameInput && nameInput.value.trim() && !getLearnerName()){
      console.log('[DP] Grabbing name from input:', nameInput.value.trim());
      sessionStorage.setItem('xapi_learner_name', nameInput.value.trim());
      updateBanner();
    }
    // Generate identity if still missing
    if(!getLearnerName() && !sessionStorage.getItem('xapi_learner_skipped')){
      skipLearnerName();
    }
    xAPI.launched();
    console.log('[xAPI] Scenario started');
    var fb = document.getElementById('nameFormBox');
    if(fb) fb.style.display = 'none';
    var btn = document.getElementById('startBtn');
    if(btn) btn.style.display = 'none';
  } catch(e) { console.error('[DP] startScenario ERROR:', e); }
}

/* ==============================

const SCORM = (function(){
  let api = null;
  let initialized = false;
  function findAPI(win){
    var depth = 0;
    while(win && depth < 10){
      if(win.API) return win.API;
      if(win.API_1484_11) return win.API_1484_11;
      try{win = win.parent;}catch(e){break;}
      depth++;
    }
    return null;
  }
  return {
    init(){
      api = findAPI(window);
      if(api){
        var result = api.LMSInitialize('');
        if(result) initialized = true;
      }
    },
    set(key, val){
      if(api) api.LMSSetValue(key, String(val));
    },
    get(key){
      if(api) return api.LMSGetValue(key);
      return null;
    },
    commit(){
      if(api) api.LMSCommit('');
    },
    finish(){
      if(api && initialized){
        api.LMSFinish('');
        initialized = false;
      }
    },
    saveScore(score, max, min, status){
      this.set('cmi.core.score.raw', score);
      this.set('cmi.core.score.max', max || 100);
      this.set('cmi.core.score.min', min || 0);
      this.set('cmi.core.lesson_status', status || 'completed');
      this.set('cmi.core.lesson_location', '');
      this.commit();
    },
    isActive(){ return !!api; }
  };
})();

   State & Scoring
   ============================== */
var state = { currentNode:'intro', waitingForContinue:false };

function getEnding(endingId){
  return NODES[endingId] || NODES.ending_closecall;
}

function calculateFinalScore(endingId){
  var base = cumulativeScore;
  if(endingId === 'ending_hero') return Math.min(Math.max(base,80),100);
  if(endingId === 'ending_closecall') return Math.min(Math.max(base,40),79);
  return Math.max(base,10);
}

function getProgressPercent(nodeId){
  var order = ['intro','d1','d2_breach','d2_neutral','d2_hero','d3_breach','d3_neutral','d3_hero','d3_passive','d3_mid','d4_breach','d4_neutral','d4_hero','d4_hero_active','d4_hero_passive','d4_mid','d5_breach','d5_neutral','d5_hero','ending_hero','ending_closecall','ending_breach'];
  var idx = order.indexOf(nodeId);
  if(idx < 0) return 0;
  var maxIdx = 13;
  return Math.min(Math.round((idx / maxIdx) * 100), 100);
}

/* ==============================
   Rendering Engine
   ============================== */
function render(nodeId){
  var node = NODES[nodeId];
  if(!node) return;
  state.currentNode = nodeId;
  state.waitingForContinue = false;
  visitedNodes.push(nodeId);
  document.getElementById('stepIndicator').textContent = node.step || '';
  document.getElementById('progressBar').style.width = getProgressPercent(nodeId) + '%';
  var container = document.getElementById('scene');
  container.classList.remove('visible');
  if(node.type === 'outcome'){
    renderOutcome(node, container);
  } else if(node.type === 'intro'){
    renderIntro(node, container);
  } else {
    renderDecision(node, container);
  }
  setTimeout(function(){ container.classList.add('visible'); }, 30);
}

function renderIntro(node, container){
  var html = '<div class="card">';
  html += '<div class="intro-badge"><span>Interactive Scenario</span><span>Data Privacy</span></div>';
  html += '<h1 class="scene-heading">'+node.heading+'</h1>';
  html += node.story;
  html += '<div id="feedbackArea"></div>';
  if(node.email){
    html += '<div class="email-wrapper">';
    html += '<div class="email-bar"><span class="email-dot red"></span><span class="email-dot yellow"></span><span class="email-dot green"></span></div>';
    html += '<div class="email-field"><span class="email-label">From:</span><span class="email-value">'+node.email.from+'</span></div>';
    html += '<div class="email-field"><span class="email-label">To:</span><span class="email-value">'+node.email.to+'</span></div>';
    html += '<div class="email-field"><span class="email-label">Subject:</span><span class="email-value urgent">'+node.email.subject+'</span></div>';
    html += '<div class="email-body">'+node.email.body+'</div>';
    html += '</div>';
  }
  html += renderChoices(node.choices, node.id);
  html += '<div id="nameFormBox" style="background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(32,69,124,.06));border:1px dashed var(--primary-light);border-radius:var(--radius-sm);padding:16px 20px;margin-top:24px;margin-bottom:24px">';
  html += '<div style="font-size:.82rem;font-weight:600;color:var(--primary);margin-bottom:4px">👤 Who\'s taking this course?</div>';
  html += '<div style="font-size:.77rem;color:var(--text-muted);margin-bottom:10px">Your name will appear in xAPI tracking statements sent to the LRS.</div>';
  html += '<div class="name-form" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">';
  html += '<input id="learnerName" type="text" placeholder="Your name (e.g. Jane Doe)" autocomplete="name" style="flex:1;min-width:160px">';
  html += '<button onclick="setLearnerName()">Save Name</button>';
  html += '<button class="skip-link" onclick="skipLearnerName()">Continue anonymously</button>';
  html += '</div>';
  html += '</div>';
  html += '<button id="startBtn" onclick="startScenario()" style="width:100%; margin-top:8px; padding:14px; background:var(--primary); color:white; border:none; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; font-family:\'Outfit\',sans-serif; font-size:15px; transition:all 0.2s ease">';
  html += 'Start Scenario <i data-lucide="arrow-right" style="width:16px;height:16px;margin-left:8px"></i>';
  html += '</button>';
  html += '</div>';
  container.innerHTML = html;
  attachChoiceHandlers(node.choices, node.id, container);
  if(typeof lucide !== 'undefined') lucide.createIcons();
}

function renderDecision(node, container){
  var html = '<div class="card">';
  html += '<h2 class="scene-heading">'+node.heading+'</h2>';
  html += '<div class="scene-story">'+node.story+'</div>';
  html += '<div class="choices-container">';
  node.choices.forEach(function(c,i){
    html += '<button class="choice-btn" data-index="'+i+'"><span class="choice-label"><span class="choice-icon">'+(c.icon==='check'?'✓':c.icon==='x'?'✗':'!')+'</span><span class="choice-text">'+c.text+'</span></span></button>';
  });
  html += '</div>';
  html += '<div id="feedbackArea"></div>';
  html += '</div>';
  container.innerHTML = html;
  var buttons = container.querySelectorAll('.choice-btn');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-index'));
      handleChoice(node.id, idx, container);
    });
  });
}

function renderChoices(choices, nodeId){
  if(!choices || !choices.length) return '';
  var html = '<div class="choices-container" style="margin-top:20px">';
  choices.forEach(function(c,i){
    html += '<button class="choice-btn" data-index="'+i+'"><span class="choice-label"><span class="choice-icon">'+(c.icon==='check'?'✓':c.icon==='x'?'✗':'!')+'</span><span class="choice-text">'+c.text+'</span></span></button>';
  });
  html += '</div>';
  return html;
}

function attachChoiceHandlers(choices, nodeId, container){
  if(!choices || !choices.length) return;
  var buttons = container.querySelectorAll('.choice-btn');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-index'));
      handleChoice(nodeId, idx, container);
    });
  });
}

function handleChoice(nodeId, choiceIdx, container){
  var node = NODES[nodeId];
  if(!node || !node.choices || state.waitingForContinue) return;
  var choice = node.choices[choiceIdx];
  if(!choice) return;
  state.waitingForContinue = true;
  totalChoices++;
  cumulativeScore += choice.score;
  if(choice.correct) correctCount++;
  var buttons = container.querySelectorAll('.choice-btn');
  buttons.forEach(function(b,i){
    b.disabled = true;
    var ci = parseInt(b.getAttribute('data-index'));
    var ch = node.choices[ci];
    if(i === choiceIdx){
      if(ch.correct) b.classList.add('selected-correct');
      else if(ch.icon === 'warning') b.classList.add('selected-neutral');
      else b.classList.add('selected-incorrect');
    } else {
      b.style.opacity = '0.4';
    }
  });
  var iconClass = choice.correct ? 'check' : (choice.icon==='warning' ? 'warning' : 'x');
  var titleClass = choice.correct ? 'positive-text' : (choice.icon==='warning' ? 'neutral-text' : 'negative-text');
  var panelClass = choice.correct ? 'positive' : (choice.icon==='warning' ? 'neutral' : 'negative');
  var feedbackHtml = '<div class="feedback-panel '+panelClass+'">';
  feedbackHtml += '<div class="feedback-header"><span class="feedback-icon '+iconClass+'">'+(iconClass==='check'?'✓':iconClass==='x'?'✗':'!')+'</span><span class="feedback-title '+titleClass+'">'+(choice.correct?'Correct Approach':choice.icon==='warning'?'Proceed with Caution':'Security Risk')+'</span></div>';
  feedbackHtml += '<div class="feedback-text">'+choice.feedback+'</div>';
  if(choice.tip){
    feedbackHtml += '<div class="tip-box"><div class="tip-label">💡 Data Privacy Tip</div><div class="tip-text">'+choice.tip+'</div></div>';
  }
  feedbackHtml += '<button class="continue-btn" id="continueBtn">Continue <span class="arrow">→</span></button>';
  feedbackHtml += '</div>';
  var area = document.getElementById('feedbackArea');
  if(area) area.innerHTML = feedbackHtml;
  xAPI.interact(nodeId, choice.text, cumulativeScore, choice.correct ? 'correct' : (choice.icon==='warning' ? 'neutral' : 'incorrect'));
  SCORM.set('cmi.core.score.raw', cumulativeScore);
  SCORM.set('cmi.core.lesson_location', nodeId);
  SCORM.commit();
  document.getElementById('continueBtn').addEventListener('click', function(){
    render(choice.next);
  });
}

function renderOutcome(node, container){
  var endingClass = node.id === 'ending_hero' ? 'hero' : (node.id === 'ending_closecall' ? 'close-call' : 'breach');
  var finalScore = calculateFinalScore(node.id);
  var status = finalScore >= 80 ? 'completed' : (finalScore >= 40 ? 'completed' : 'failed');
  var html = '<div class="card outcome-screen">';
  html += '<div class="outcome-badge '+endingClass+'">'+node.badge+'</div>';
  html += '<h2 class="outcome-title '+endingClass+'">'+node.title+'</h2>';
  html += '<p class="outcome-subtitle">'+node.message+'</p>';
  html += '<div class="score-display">';
  html += '<div class="score-item"><div class="score-value '+endingClass+'">'+finalScore+'</div><div class="score-label">Final Score</div></div>';
  html += '<div class="score-item"><div class="score-value">'+correctCount+'/'+totalChoices+'</div><div class="score-label">Correct Choices</div></div>';
  html += '<div class="score-item"><div class="score-value">'+visitedNodes.length+'</div><div class="score-label">Scenes Visited</div></div>';
  html += '</div>';
  html += '<div class="outcome-details"><h4>What Happened</h4><ul>';
  node.details.forEach(function(d){ html += '<li>'+d+'</li>'; });
  html += '</ul></div>';
  html += '<div class="lessons-box"><h4>📋 Key Lessons Learned</h4><ul>';
  node.lessons.forEach(function(l){ html += '<li>'+l+'</li>'; });
  html += '</ul></div>';
  html += '<button class="retry-btn" id="retryBtn">🔄 Retry Scenario</button>';
  html += '<div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">';
  html += '<a href="../" class="btn btn-primary"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Back to Portfolio</a>';
  html += '</div>';
  html += '</div>';
  container.innerHTML = html;
  if(typeof lucide !== 'undefined') lucide.createIcons();
  SCORM.saveScore(finalScore, 100, 0, status);
  xAPI.complete(finalScore, node.id, correctCount, totalChoices, visitedNodes);
  document.getElementById('retryBtn').addEventListener('click', function(){ resetScenario(); });
}

function resetScenario(){
  correctCount = 0;
  totalChoices = 0;
  visitedNodes = [];
  cumulativeScore = 50;
  state.waitingForContinue = false;
  SCORM.set('cmi.core.lesson_status','incomplete');
  SCORM.set('cmi.core.score.raw',0);
  SCORM.commit();
  render('intro');
}

/* ==============================
   Initialization
   ============================== */
function init(){
  try {
    console.log('[xAPI] init() started — using LRS:', LRS_ENDPOINT);
    updateBanner();
    SCORM.init();
    SCORM.set('cmi.core.lesson_status','incomplete');
    SCORM.set('cmi.core.score.raw',0);
    SCORM.set('cmi.core.score.max',100);
    SCORM.set('cmi.core.score.min',0);
    SCORM.commit();
    render('intro');
    // After render('intro'), the nameFormBox and startBtn exist in the DOM.
    // If the user already has a name, hide the form.
    if(getLearnerName() || sessionStorage.getItem('xapi_learner_skipped')){
      var fb = document.getElementById('nameFormBox');
      if(fb) fb.style.display = 'none';
    }
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var cb = document.getElementById('continueBtn');
        if(cb) cb.click();
      }
    });
    console.log('[xAPI] init() complete');
  } catch(e) {
    console.error('[xAPI] init() ERROR:', e);
  }
}
window.addEventListener('load', init);
window.addEventListener('DOMContentLoaded', function() {
  if(typeof lucide !== 'undefined') {
    lucide.createIcons();
    console.log('[Lucide] Icons initialized on DOMContentLoaded');
  }
});
window.addEventListener('beforeunload', function(){ SCORM.finish(); });
</script>
</body>
</html>
