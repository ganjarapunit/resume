<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{COURSE_TITLE}} | Punit Ganjara</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="scorm_wrapper.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="course-shell">
        <header>
            <p class="portfolio-badge">Punit's SCORM Portfolio</p>
            <h1>{{COURSE_TITLE}}</h1>
            <p class="subtitle">{{COURSE_SUBTITLE}}</p>
        </header>

        <main>
            <!-- ══ Your course content here ══ -->
            <section class="content-card">
                <div class="card-icon">
                    <i data-lucide="{{CARD_ICON}}"></i>
                </div>
                <h2>{{SECTION_TITLE}}</h2>
                <p>{{SECTION_DESCRIPTION}}</p>

                {{SECTION_CONTENT}}
            </section>
            <!-- ══ End content ══ -->
        </main>

        <footer>
            <button id="complete-btn" class="btn btn-primary" onclick="markComplete()">
                <span id="btn-text">Mark as Complete</span>
                <span id="tick-icon" style="display: none; margin-left: 10px;">
                    <i data-lucide="check-circle" style="width:24px; height:24px;"></i>
                </span>
            </button>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        function markComplete() {
            setCompletion();
            const btn = document.getElementById('complete-btn');
            const btnText = document.getElementById('btn-text');
            const tick = document.getElementById('tick-icon');
            btn.style.background = '#10b981';
            btnText.innerText = 'Complete!';
            tick.style.display = 'inline-block';
            lucide.createIcons();
            setTimeout(function() {
                alert("{{COMPLETION_MESSAGE}}");
            }, 300);
        }
    </script>
</body>
</html>
