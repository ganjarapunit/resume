<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Analytics | Punit Ganjara</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #20457c;
            --accent: #10b981;
            --bg: #f1f5f9;
            --r-lg: 24px;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; animation: fadeIn 0.8s ease; }
        .card { background: white; padding: clamp(20px, 5vw, 40px); border-radius: var(--r-lg); box-shadow: 0 10px 40px rgba(0,0,0,.05); border: 1px solid rgba(255,255,255,0.5); }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn"><i data-lucide="arrow-left"></i> Back to Portfolio</a>
        <div class="card">
            <div class="header">
                <i data-lucide="bar-chart-3" style="color: var(--accent); width: 32px; height: 32px;"></i>
                <h1 style="color: var(--primary); margin: 0; font-size: clamp(1.5rem, 5vw, 2rem);">Learning Analytics Dashboard</h1>
            </div>
            <p style="color: #64748b; margin-bottom: 30px; line-height: 1.6;">This real-time dashboard tracks xAPI statements from the IELTS Masterclass and Interactive Quiz modules.</p>
            <div class="iframe-container">
                <iframe src="https://lrs.io/integrations/embedableDashboards/dfbc5bbd-661b-402e-a99f-ad6050d9efa8/" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
