<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punit Ganjara | Learning Experience Designer</title>
    <meta name="description" content="Portfolio of Punit Ganjara — Learning Experience Designer crafting immersive, evidence-based digital learning experiences.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ── Tokens ── */
        :root {
            --primary:       #20457c;
            --primary-light: #3b6fb3;
            --primary-dark:  #162f56;
            --accent:        #10b981;
            --text:          #0f172a;
            --text-muted:    #64748b;
            --text-light:    #94a3b8;
            --bg:            #f1f5f9;
            --glass-bg:      rgba(255,255,255,0.72);
            --glass-border:  rgba(255,255,255,0.45);
            --sidebar-w:     320px;
            --ease:          0.35s cubic-bezier(0.4,0,0.2,1);
            --r-lg: 24px; --r-md: 16px; --r-sm: 10px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Layout ── */
        .layout { display: flex; min-height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; inset: 0 auto 0 0;
            width: var(--sidebar-w);
            background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid var(--glass-border);
            box-shadow: 4px 0 40px rgba(0,0,0,.06);
            display: flex; flex-direction: column;
            overflow-y: auto; z-index: 1000;
        }

        .sidebar-header { padding: 40px 28px 28px; border-bottom: 1px solid var(--glass-border); }
        .profile-name { font-size: 1.45rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 6px; }
        .profile-tagline { font-size: .82rem; font-weight: 600; color: var(--accent); text-transform: uppercase; }

        .sidebar-body { padding: 24px 28px; flex: 1; display: flex; flex-direction: column; gap: 28px; }
        .section-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); margin-bottom: 12px; }

        /* Contact Items */
        .contact-list { display: flex; flex-direction: column; gap: 8px; }
        .contact-item {
            display: flex; align-items: flex-start; gap: 10px;
            color: var(--text-muted); text-decoration: none;
            font-size: .85rem; font-weight: 500; padding: 8px 12px;
            border-radius: var(--r-sm); transition: all .25s ease;
        }
        .contact-item:hover { background: rgba(32,69,124,.07); color: var(--primary); }
        .contact-item svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }

        /* Portfolio links */
        .project-nav { display: flex; flex-direction: column; gap: 10px; }
        .project-link {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; background: white; color: var(--primary);
            text-decoration: none; border-radius: var(--r-md);
            font-size: .88rem; font-weight: 700; border: 1px solid var(--glass-border);
            box-shadow: 0 2px 8px rgba(0,0,0,.04); transition: all .3s ease;
        }
        .project-link:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(32,69,124,.2); }
        .link-icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(32,69,124,.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Main Content Area */
        .main-content { flex: 1; margin-left: var(--sidebar-w); padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .h5p-wrap { width: 100%; max-width: 1200px; background: white; border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.09); min-height: 80vh; }
        #h5p-container { width: 100%; min-height: 100%; }

        @media (max-width: 1023px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="profile-name">Punit Ganjara</h1>
                <p class="profile-tagline">Learning Experience Designer</p>
            </div>

            <div class="sidebar-body">
                <section>
                    <p class="section-label">Connect</p>
                    <div class="contact-list">
                        <a href="mailto:ganjarapunit@gmail.com" class="contact-item">
                            <i data-lucide="mail"></i><span>ganjarapunit@gmail.com</span>
                        </a>
                        <div class="contact-item">
                            <i data-lucide="phone"></i>
                            <span>+84 822 523 395<br>+91 90961 05012</span>
                        </div>
                        <div class="contact-item">
                            <i data-lucide="map-pin"></i>
                            <span>Ho Chi Minh City, VN<br>Mumbai, India</span>
                        </div>
                        <a href="https://linkedin.com/in/ganjarapunit" target="_blank" class="contact-item">
                            <i data-lucide="linkedin"></i><span>linkedin.com/in/ganjarapunit</span>
                        </a>
                    </div>
                </section>

                <section>
                    <p class="section-label">Portfolio</p>
                    <nav class="project-nav">
                        <a href="ielts-masterclass/" class="project-link">
                            <div class="link-icon"><i data-lucide="graduation-cap"></i></div>
                            <span class="link-text">IELTS Speaking</span>
                        </a>
                        <a href="interactive-quiz/" class="project-link">
                            <div class="link-icon"><i data-lucide="layers"></i></div>
                            <span class="link-text">Interactive Quiz</span>
                        </a>
                        <a href="https://lrs.io/integrations/embedableDashboards/dfbc5bbd-661b-402e-a99f-ad6050d9efa8/" target="_blank" class="project-link">
                            <div class="link-icon"><i data-lucide="bar-chart-3"></i></div>
                            <span class="link-text">Learning Analytics</span>
                        </a>
                    </nav>
                </section>
            </div>
        </aside>

        <main class="main-content">
            <div class="h5p-wrap">
                <div id="h5p-container"></div>
            </div>
        </main>
    </div>

    <!-- Ensure these script files exist in your root directory -->
    <script src="main.bundle.js"></script>
    <script>
        // Render Lucide Icons
        lucide.createIcons();

        // Initialize H5P (Restoring your original logic)
        const container = document.getElementById('h5p-container');
        try {
            new H5PStandalone.H5P(container, {
                h5pJsonPath: './activity-data',
                frameJs:     './frame.bundle.js',
                frameCss:    './styles/h5p.css'
            });
        } catch (e) {
            console.error('H5P Initialization failed:', e);
            container.innerHTML = '<p style="padding:20px; color:red;">H5P module failed to initialize. Please check console for errors.</p>';
        }
    </script>
</body>
</html>
