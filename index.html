<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punit Ganjara | Learning Experience Designer</title>
    <meta name="description" content="Portfolio of Punit Ganjara — Learning Experience Designer crafting immersive, evidence-based digital learning experiences.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ── Tokens ── */
        :root {
            --primary:       #20457c;
            --primary-light: #3b6fb3;
            --primary-dark:  #162f56;
            --accent:        #10b981;
            --text:          #0f172a;
            --text-muted:    #64748b;
            --text-light:    #94a3b8;
            --bg:            #f1f5f9;
            --glass-bg:      rgba(255,255,255,0.72);
            --glass-border:  rgba(255,255,255,0.45);
            --sidebar-w:     320px;
            --ease:          0.35s cubic-bezier(0.4,0,0.2,1);
            --r-lg: 24px; --r-md: 16px; --r-sm: 10px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Ambient blobs */
        body::before, body::after {
            content: ''; position: fixed; z-index: -1;
            border-radius: 50%; filter: blur(90px); pointer-events: none;
        }
        body::before {
            top: -120px; right: -80px; width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(32,69,124,.13) 0%, transparent 70%);
        }
        body::after {
            bottom: -100px; left: -60px; width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(16,185,129,.10) 0%, transparent 70%);
        }

        /* ── Layout ── */
        .layout { display: flex; min-height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; inset: 0 auto 0 0;
            width: var(--sidebar-w);
            background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid var(--glass-border);
            box-shadow: 4px 0 40px rgba(0,0,0,.06);
            display: flex; flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            z-index: 1000;
            transition: transform var(--ease), box-shadow var(--ease), width var(--ease);
            scrollbar-width: thin;
            scrollbar-color: rgba(32,69,124,.25) transparent;
        }
        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(32,69,124,.25); border-radius: 99px; }

        .layout.sidebar-closed .sidebar { transform: translateX(-100%); }
        .layout.sidebar-closed .main-content { margin-left: 0; }

        /* ── Sidebar Header ── */
        .sidebar-header {
            padding: 40px 28px 28px;
            background: linear-gradient(160deg, rgba(32,69,124,.08) 0%, transparent 100%);
            border-bottom: 1px solid var(--glass-border);
        }
        .avatar-wrap { position: relative; width: 88px; height: 88px; margin-bottom: 18px; }
        .avatar-ring {
            position: absolute; inset: -4px; border-radius: 28px;
            background: linear-gradient(135deg, var(--primary), var(--accent)); z-index: 0;
        }
        .profile-pic {
            position: relative; z-index: 1;
            width: 88px; height: 88px; object-fit: cover;
            border-radius: 24px; border: 3px solid white; display: block;
            transition: transform .45s ease;
        }
        .profile-name {
            font-size: 1.45rem; font-weight: 800;
            color: var(--primary-dark); letter-spacing: -.4px; line-height: 1.2; margin-bottom: 6px;
        }
        .profile-tagline {
            font-size: .82rem; font-weight: 600;
            color: var(--accent); text-transform: uppercase; letter-spacing: .8px;
        }
        .skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
        .skill-badge {
            font-size: .72rem; font-weight: 600; padding: 4px 10px;
            border-radius: 99px; background: rgba(32,69,124,.08);
            color: var(--primary); border: 1px solid rgba(32,69,124,.15);
        }

        /* ── Sidebar Body ── */
        .sidebar-body { padding: 24px 28px; flex: 1; display: flex; flex-direction: column; gap: 28px; }

        .section-label {
            font-size: .68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.6px; color: var(--text-light); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-border), transparent); }

        /* ── Dropdown / Accordion Logic ── */
        .dropdown-trigger {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; cursor: pointer; user-select: none;
            padding: 4px 0;
        }
        .dropdown-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0; display: flex; flex-direction: column; gap: 6px;
        }
        #connect-toggle:checked ~ .dropdown-content {
            max-height: 400px; opacity: 1; margin-top: 12px;
        }
        #connect-toggle:checked ~ .dropdown-trigger .chevron { transform: rotate(180deg); }
        .chevron { transition: transform 0.3s ease; width: 14px; height: 14px; color: var(--text-light); }

        .contact-item {
            display: flex; align-items: center; gap: 10px;
            color: var(--text-muted); text-decoration: none;
            font-size: .85rem; font-weight: 500;
            padding: 8px 12px; border-radius: var(--r-sm);
            transition: all .25s ease;
        }
        .contact-item:hover { background: rgba(32,69,124,0.07); color: var(--primary); transform: translateX(3px); }
        .contact-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.65; }
        .contact-item:hover svg { opacity: 1; }

        /* ── Consistent Project Links ── */
        .project-nav { display: flex; flex-direction: column; gap: 10px; }
        .project-link {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; background: white; color: var(--primary);
            text-decoration: none; border-radius: var(--r-md);
            font-size: .88rem; font-weight: 700;
            border: 1px solid var(--glass-border);
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
            transition: all 0.3s cubic-bezier(.175,.885,.32,1.275);
            position: relative; overflow: hidden;
        }
        .project-link::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            opacity: 0; transition: opacity .3s ease;
        }
        .project-link:hover::before { opacity: 1; }
        .project-link:hover { color: white; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(32,69,124,.2); }
        .link-icon {
            position: relative; z-index: 1; width: 34px; height: 34px;
            border-radius: 10px; background: rgba(32,69,124,.08);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background .3s ease;
        }
        .project-link:hover .link-icon { background: rgba(255,255,255,.15); }
        .link-icon svg { width: 16px; height: 16px; }
        .link-text { position: relative; z-index: 1; flex: 1; }
        .link-arrow {
            position: relative; z-index: 1; width: 16px; height: 16px;
            opacity: .5; transition: transform .25s ease, opacity .25s ease;
        }
        .project-link:hover .link-arrow { transform: translateX(3px); opacity: 1; }

        /* ── Main Content ── */
        .main-content {
            flex: 1; margin-left: var(--sidebar-w); padding: 24px 40px 40px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            transition: margin-left var(--ease);
        }
        .h5p-wrap {
            width: 100%; max-width: 1200px; flex: 1;
            background: white; border-radius: var(--r-lg); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.09);
            border: 1px solid rgba(255,255,255,0.9);
            min-height: calc(100vh - 72px);
        }
        #h5p-container { width: 100%; min-height: inherit; }

        /* Menu Toggle */
        .menu-toggle {
            position: fixed; top: 16px; left: calc(var(--sidebar-w) + 16px); z-index: 1100;
            width: 44px; height: 44px; border-radius: var(--r-sm);
            background: white; border: 1px solid var(--glass-border);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--primary); transition: left var(--ease);
        }
        .layout.sidebar-closed .menu-toggle { left: 16px; }
    </style>
</head>
<body>

    <button class="menu-toggle" id="menuBtn" onclick="toggleSidebar()">
        <i data-lucide="panel-left-close" id="menuIcon"></i>
    </button>

    <div class="layout" id="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="avatar-wrap">
                    <div class="avatar-ring"></div>
                    <img src="profile.png" alt="Punit Ganjara" class="profile-pic">
                </div>
                <h1 class="profile-name">Punit Ganjara</h1>
                <p class="profile-tagline">Learning Experience Designer</p>
                <!-- Space for your future keywords -->
                <div class="skills-wrap">
                    <span class="skill-badge">End-to-End Course Design</span>
                    <span class="skill-badge">eLearning Development</span>
                    <span class="skill-badge">xAPI</span>
                </div>
            </div>

            <div class="sidebar-body">
                <!-- Connect Dropdown Section -->
                <section>
                    <input type="checkbox" id="connect-toggle" hidden>
                    <label for="connect-toggle" class="dropdown-trigger">
                        <span class="section-label" style="margin-bottom:0;">Connect</span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </label>
                    <div class="dropdown-content">
                        <a href="mailto:ganjarapunit@gmail.com" class="contact-item">
                            <i data-lucide="mail"></i><span>ganjarapunit@gmail.com</span>
                        </a>
                        <a href="tel:+84822523395" class="contact-item">
                            <i data-lucide="phone"></i><span>+84 822 523 395 (VN)</span>
                        </a>
                        <a href="tel:+919096105012" class="contact-item">
                            <i data-lucide="phone"></i><span>+91 9096105012 (IN)</span>
                        </a>
                        <div class="contact-item">
                            <i data-lucide="map-pin"></i><span>Ho Chi Minh City, VN</span>
                        </div>
                        <div class="contact-item">
                            <i data-lucide="map-pin"></i><span>Mumbai, India</span>
                        </div>
                        <a href="https://linkedin.com/in/ganjarapunit" target="_blank" rel="noopener" class="contact-item">
                            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                            </svg>
                            <span>LinkedIn Profile</span>
                        </a>
                    </div>
                </section>

                <section>
                    <p class="section-label">Portfolio</p>
                    <nav class="project-nav">
                        <a href="ielts-masterclass/" class="project-link">
                            <div class="link-icon"><i data-lucide="graduation-cap"></i></div>
                            <span class="link-text">IELTS Speaking Masterclass</span>
                            <i data-lucide="arrow-right" class="link-arrow"></i>
                        </a>
                        <a href="interactive-quiz/" class="project-link">
                            <div class="link-icon"><i data-lucide="layers"></i></div>
                            <span class="link-text">Interactive Quiz</span>
                            <i data-lucide="arrow-right" class="link-arrow"></i>
                        </a>
                        <!-- Unified Style for Analytics -->
                        <a href="https://lrs.io/integrations/embedableDashboards/dfbc5bbd-661b-402e-a99f-ad6050d9efa8/" target="_blank" class="project-link">
                            <div class="link-icon"><i data-lucide="bar-chart-3"></i></div>
                            <span class="link-text">Learning Analytics</span>
                            <i data-lucide="arrow-right" class="link-arrow"></i>
                        </a>
                    </nav>
                </section>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="h5p-wrap">
                <div id="h5p-container"></div>
            </div>
        </main>
    </div>

    <script src="main.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/h5p-standalone@3.5.1/dist/main.bundle.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() {
            const layout = document.getElementById('layout');
            const isClosed = layout.classList.toggle('sidebar-closed');
            document.getElementById('menuIcon').setAttribute('data-lucide', isClosed ? 'panel-left-open' : 'panel-left-close');
            lucide.createIcons();
        }

        const el = document.getElementById('h5p-container');
        if (typeof H5PStandalone !== 'undefined') {
            new H5PStandalone.H5P(el, {
                h5pJsonPath: './activity-data',
                frameJs: './frame.bundle.js',
                frameCss: './styles/h5p.css'
            });
        }
    </script>
</body>
</html>
