<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workplace Safety Compliance Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .course-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a237e 0%, #283593 100%);
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
            overflow-y: auto;
            max-height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar-header {
            position: relative;
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .sidebar-header .progress-info {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #4caf50;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .nav-section {
            padding: 5px 0;
        }

        .nav-section-header {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.9);
            transition: background 0.2s;
        }

        .nav-section-header:hover {
            background: rgba(255,255,255,0.1);
        }

        .nav-lessons {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .nav-section.collapsed .nav-lessons {
            max-height: 0 !important;
        }

        .nav-lesson {
            padding: 8px 20px 8px 36px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.85);
        }

        .nav-lesson:hover {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
        }

        .nav-lesson.active {
            background: rgba(255,255,255,0.15);
            border-left: 3px solid #4caf50;
            color: #ffffff;
        }

        .nav-lesson.completed {
            color: rgba(255,255,255,0.7);
        }

        .nav-chevron {
            font-size: 10px;
            transition: transform 0.2s;
        }

        /* Sidebar Toggle — floating button, always visible */
        .sidebar-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1001;
            background: #1a237e;
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .sidebar-toggle:hover {
            background: #283593;
            transform: scale(1.05);
        }

        .sidebar-toggle:hover {
            background: #283593;
        }



        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .sidebar.collapsed .sidebar-header,
        .sidebar.collapsed #nav-sections,
        .sidebar.collapsed #sidebar-progress,
        .sidebar.collapsed #sidebar-certificate {
            display: none;
        }

        /* Certificate button in sidebar */
        .sidebar-cert-btn {
            display: block;
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .sidebar-cert-btn.locked {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.35);
            cursor: not-allowed;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }
        .sidebar-cert-btn.unlocked {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #ffd54f;
            border: 1px solid rgba(255, 213, 79, 0.3);
            box-shadow: 0 2px 8px rgba(26, 35, 126, 0.4);
        }
        .sidebar-cert-btn.unlocked:hover {
            background: linear-gradient(135deg, #283593, #3949ab);
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.6);
            transform: translateY(-1px);
        }
        .sidebar-cert-btn .cert-icon {
            font-size: 18px;
            margin-right: 6px;
        }

        /* Content header push removed — toggle is now inside sidebar */

        .main-content {
            transition: margin-left 0.3s ease;
        }

        /* Locked section overlay */
        .section-locked-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            padding: 40px;
        }

        .section-locked-overlay .lock-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .section-locked-overlay h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }

        .section-locked-overlay p {
            color: #666;
            font-size: 16px;
            max-width: 500px;
            line-height: 1.6;
        }

        .section-locked-overlay .required-quizzes {
            margin-top: 20px;
            text-align: left;
            background: #f5f5f5;
            padding: 16px 24px;
            border-radius: 8px;
            border-left: 4px solid #1a237e;
        }

        .section-locked-overlay .required-quizzes ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .section-locked-overlay .required-quizzes li {
            margin-bottom: 4px;
            color: #555;
        }

        /* Sidebar locked styling */
        .nav-lesson.locked {
            color: rgba(255,255,255,0.45);
            cursor: not-allowed !important;
            pointer-events: none;
        }

        .nav-lesson.locked .lock-indicator {
            font-size: 11px;
            margin-left: auto;
            color: rgba(255,255,255,0.7);
        }

        /* Certificate Modal */
        .certificate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .certificate-modal {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .certificate-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .certificate-actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .certificate-actions .btn-print {
            background: #1a237e;
            color: white;
        }

        .certificate-actions .btn-print:hover {
            background: #283593;
        }

        .certificate-actions .btn-close {
            background: #e0e0e0;
            color: #333;
        }

        .certificate-actions .btn-close:hover {
            background: #bdbdbd;
        }

        /* Print certificate styles */
        @media print {
            body * {
                visibility: hidden;
            }
            .certificate-overlay,
            .certificate-overlay * {
                visibility: visible;
            }
            .certificate-overlay {
                position: absolute;
                top: 0;
                left: 0;
                background: white;
                padding: 0;
            }
            .certificate-modal {
                box-shadow: none;
                max-height: none;
                border-radius: 0;
            }
            .certificate-actions {
                display: none !important;
            }
        }

        /* Quiz results enhanced */
        .quiz-results-box.quiz-pass {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .quiz-results-box.quiz-fail {
            background: #ffebee;
            border: 2px solid #f44336;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .quiz-results-box h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 3px solid #1a237e;
        }

        .breadcrumb {
            font-size: 13px;
            color: #666;
        }

        .breadcrumb span {
            color: #1a237e;
            font-weight: 500;
        }

        .content-body, .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Cover Section — Hero Banner */
        .cover-section {
            background: linear-gradient(135deg, #1a237e 0%, #283593 40%, #3949ab 70%, #5c6bc0 100%);
            color: white;
            padding: 60px 40px 50px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(26, 35, 126, 0.3);
        }

        .cover-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .cover-section::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .cover-section h1 {
            font-size: 36px;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .cover-section .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .cover-section .duration {
            font-size: 14px;
            opacity: 0.8;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            position: relative;
            z-index: 1;
        }

        .start-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s, transform 0.2s;
        }

        .start-btn:hover {
            background: #43a047;
            transform: translateY(-2px);
        }

        /* Section Cards — Articulate-style landing */
        .section-cards {
            margin-top: 30px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .section-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .section-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .section-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .section-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .section-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 6px;
        }

        .section-card-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .section-card-meta {
            font-size: 11px;
            color: #595959;
            font-weight: 500;
        }

        /* Statement Block — Agree/Disagree */
        .statement-block {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .statement-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
        }

        .statement-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .statement-btn {
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .statement-btn.agree {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #a5d6a7;
        }

        .statement-btn.agree:hover, .statement-btn.agree.selected {
            background: #4caf50;
            color: white;
        }

        .statement-btn.disagree {
            background: #ffebee;
            color: #c62828;
            border-color: #ef9a9a;
        }

        .statement-btn.disagree:hover, .statement-btn.disagree.selected {
            background: #ef5350;
            color: white;
        }

        .statement-feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .statement-feedback.show { display: block; }
        .statement-feedback.correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .statement-feedback.incorrect { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        /* Tabs Block */
        .tabs-block {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .tabs-nav {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
            gap: 0;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn:hover { color: #1a237e; }
        .tab-btn.active {
            color: #1a237e;
            border-bottom-color: #1a237e;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-panel.active { display: block; }

        /* Quote Block */
        .quote-block {
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            border-left: 5px solid #1a237e;
            border-radius: 0 12px 12px 0;
            padding: 30px 35px;
            margin: 20px 0;
            position: relative;
        }

        .quote-block::before {
            content: '\201C';
            font-size: 80px;
            color: #1a237e;
            opacity: 0.15;
            position: absolute;
            top: -10px;
            left: 20px;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .quote-text {
            font-size: 18px;
            font-style: italic;
            color: #333;
            line-height: 1.7;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .quote-author {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        /* Image Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .gallery-item {
            background: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gallery-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        /* Animated Checkmark */
        @keyframes checkmarkDraw {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }

        .checkmark-animated {
            display: inline-flex;
            width: 20px;
            height: 20px;
        }

        .checkmark-animated svg {
            width: 100%;
            height: 100%;
        }

        .checkmark-animated svg circle {
            fill: #4caf50;
        }

        .checkmark-animated svg path {
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 24;
            animation: checkmarkDraw 0.4s ease-out forwards;
        }

        /* Section Headers */
        .section-header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-left: 4px solid #1a237e;
        }

        .section-header h2 {
            font-size: 24px;
            color: #1a237e;
            margin-bottom: 10px;
        }

        .section-header p {
            color: #666;
            line-height: 1.6;
        }

        /* Content Cards */
        .content-card {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .content-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            transform: translateY(-1px);
        }

        .content-card h3 {
            font-size: 18px;
            color: #1a237e;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-card p, .content-card li {
            line-height: 1.7;
            color: #555;
        }

        .content-card ul, .content-card ol {
            padding-left: 20px;
            margin-top: 10px;
        }

        .content-card li {
            margin-bottom: 8px;
        }

        /* Info Boxes */
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
        }

        .info-box p, .info-box strong, .info-box li {
            color: #1a2332;
        }

        .info-box a {
            color: #1565c0;
        }

        .warning-box {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
        }

        .danger-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
        }

        .success-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
        }

        /* Quiz Styles */
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .quiz-question {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }

        .quiz-question:last-child {
            border-bottom: none;
        }

        .quiz-question h4 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            border-color: #1a237e;
            background: #f5f5ff;
        }

        .quiz-option.selected {
            border-color: #1a237e;
            background: #e8eaf6;
        }

        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .quiz-option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .quiz-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a237e;
        }

        .quiz-feedback {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .quiz-feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .quiz-feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        /* Drag & Drop Activity */
        .drag-drop-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .drag-items {
            flex: 1;
            min-width: 200px;
        }

        .drop-zones {
            flex: 1;
            min-width: 200px;
        }

        .drag-item {

            border: 2px solid transparent;

        .drop-zone {

        .drag-item.correct {

            background: #e8f5e9;
        }

        .drag-item.incorrect {

        .drag-over {

        .drag-drop-items {

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;

            border-top: 1px solid #eee;

        /* ─── Accordion Component ─── */
        .accordion-container {
            margin: 16px 0;

        /* ─── Timeline Component ─── */

        /* ─── Enhanced Callout Boxes (with icons) ─── */
        .callout {

        .callout.info { background: #e3f2fd; border-left: 4px solid #2196f3; }

        /* ─── True/False Question Styles ─── */
        .tf-options {

        .matching-select {

        /* ─── WCAG 2.1 Accessibility ─── */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 16px;
            background: #1a237e;
            color: white;
            padding: 12px 24px;
            border-radius: 0 0 8px 8px;
            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

        *:focus-visible {

        }

        .nav-lesson:focus-visible,
        .nav-btn:focus-visible,
        .accordion-header:focus-visible,
        .tf-btn:focus-visible,
        .quiz-option:focus-visible {
            outline: 3px solid #ff9800;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-contrast: more) {
            .info-box { border-left-width: 6px; }
            .warning-box { border-left-width: 6px; }
            .danger-box { border-left-width: 6px; }
            .success-box { border-left-width: 6px; }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;

            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);

        /* ─── Per-Option Feedback ─── */
        .quiz-option-feedback {

        .quiz-option-feedback.incorrect-feedback { border-left-color: #f44336; background: #ffebee; }

        /* ─── Labeled Graphic / Hotspot ─── */
        .labeled-graphic {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 700px;
            margin: 16px 0;
        }
        .labeled-graphic img,
        .labeled-graphic .lg-placeholder {
            width: 100%;
            border-radius: 8px;
            display: block;
        }
        .lg-placeholder {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #1565c0;
            font-weight: 600;
        }
        .hotspot {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(26, 35, 126, 0.85);
            border: 3px solid white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 2;
        }
        .hotspot:hover,
        .hotspot:focus {
            transform: scale(1.2);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            outline: none;
        }
        .hotspot-dot {
            width: 28px;
            height: 28px;
            background: #1565c0;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }
        .video-placeholder {
            background: #0d1117;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .video-placeholder:hover {
            opacity: 0.85;
        }
        .hotspot-tooltip {
            position: absolute;
            background: #1a237e;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            width: 260px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 11;
            display: none;
            pointer-events: none;
        }
        .hotspot-tooltip::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #1a237e;
            transform: rotate(45deg);
        }
        .hotspot-tooltip.visible { display: block; }
        .hotspot-tooltip[data-pos="right"]::before { left: -5px; top: 12px; }
        .hotspot-tooltip[data-pos="left"]::before { right: -5px; top: 12px; }
        .hotspot-tooltip[data-pos="bottom"]::before { top: -5px; left: 50%; margin-left: -5px; }
        .hotspot-tooltip[data-pos="top"]::before { bottom: -5px; left: 50%; margin-left: -5px; }

        /* ─── Flashcard ─── */
        .flashcard-container {
            perspective: 1000px;
            margin: 16px 0;
        }
        .flashcard {
            width: 100%;
            max-width: 500px;

            transition: transform 0.5s ease;

        .flashcard.active { display: block; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-face {

            transform-style: preserve-3d;

        .flashcard-front,

        /* ─── Process Steps ─── */

        /* ─── Scenario Branching ─── */
        .scenario-container {

        /* ─── Video Player ─── */
        .video-player {
            margin: 16px 0;

            overflow: hidden;
            background: #000;
