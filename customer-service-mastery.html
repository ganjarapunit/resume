<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service De-Escalation Mastery | Punit Ganjara</title>
    <meta name="description" content="Interactive branching scenario: Learn customer service de-escalation techniques through realistic decision-making scenarios.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/h5p.svg">
    <style>
        :root {
            --primary:       #20457c;
            --primary-light: #3b6fb3;
            --primary-dark:  #162f56;
            --accent:        #10b981;
            --text:          #0f172a;
            --text-muted:    #566579;
            --bg:            #f1f5f9;
            --r-lg: 24px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }
        body::before, body::after {
            content: ''; position: fixed; z-index: -1;
            border-radius: 50%; filter: blur(90px); pointer-events: none;
        }
        body::before {
            top: -120px; right: -80px; width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(32,69,124,.13) 0%, transparent 70%);
        }
        body::after {
            bottom: -100px; left: -60px; width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(16,185,129,.10) 0%, transparent 70%);
        }
        .h5p-page {
            min-height: 100vh;
            padding: 24px 40px 40px;
            display: flex; flex-direction: column;
            align-items: center;
        }
        .h5p-wrap {
            width: 100%; max-width: 1200px; flex: 1;
            background: white; border-radius: var(--r-lg); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.09), 0 1px 0 rgba(255,255,255,.8) inset;
            border: 1px solid rgba(255,255,255,.9);
            animation: riseUp .7s cubic-bezier(.23,1,.32,1) both;
            min-height: calc(100vh - 72px);
        }
        #h5p-container { width: 100%; min-height: inherit; }
        .h5p-loading {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 480px; gap: 16px; color: var(--text-muted);
        }
        .h5p-loading svg { width: 40px; height: 40px; animation: spin 1.8s linear infinite; color: var(--primary); opacity: .5; }
        .h5p-loading p { font-size: .9rem; font-weight: 500; }
        .back-bar{display:flex;align-items:center;gap:6px;padding:8px 0 4px;font-size:13px;font-weight:500;color:var(--text-muted);text-decoration:none;transition:all .25s ease;align-self:flex-start;max-width:1200px;width:100%}
        .back-bar:hover{color:var(--primary-light)}
        .back-bar svg{width:16px;height:16px;transition:transform .2s ease}
        .back-bar:hover svg{transform:translateX(-3px)}
        @keyframes riseUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
        @keyframes spin   { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
        @media (max-width: 1023px) {
            .h5p-page { padding: 72px 20px 36px; }
            .h5p-wrap { border-radius: 16px; min-height: calc(100svh - 120px); }
        }
        @media (max-width: 640px) {
            .h5p-page { padding: 68px 14px 28px; }
            .h5p-wrap { border-radius: 14px; }
        }
        [data-theme="dark"] {
            --primary:       #3b82f6;
            --primary-light: #60a5fa;
            --primary-dark:  #1d4ed8;
            --accent:        #34d399;
            --text:          #e2e8f0;
            --text-muted:    #94a3b8;
            --bg:            #0b1120;
        }
        [data-theme="dark"] body::before {
            background: radial-gradient(circle, rgba(59,130,246,.10) 0%, transparent 70%);
        }
        [data-theme="dark"] body::after {
            background: radial-gradient(circle, rgba(52,211,153,.08) 0%, transparent 70%);
        }
        [data-theme="dark"] .h5p-wrap {
            background: rgba(30,41,59,0.7);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }
        /* ── H5P Library font fixes ── */
        @font-face {
            font-family: "bs";
            src: local("Segoe UI Symbol"), local("Arial Unicode MS");
            unicode-range: U+E900-E901;
        }
        @font-face {
            font-family: "H5PRobotoLight";
            src: local("Segoe UI"), local("Roboto"), local("sans-serif");
            font-weight: 300;
        }
        @font-face {
            font-family: "H5PRobotoMedium";
            src: local("Segoe UI"), local("Roboto"), local("sans-serif");
            font-weight: 500;
        }
        @font-face {
            font-family: "H5PRobotoRegular";
            src: local("Segoe UI"), local("Roboto"), local("sans-serif");
            font-weight: 400;
        }
        @font-face {
            font-family: "H5PRobotoBold";
            src: local("Segoe UI"), local("Roboto"), local("sans-serif");
            font-weight: 700;
        }
        .theme-toggle {
            position: fixed; top: 16px; right: 16px; z-index: 1100;
            width: 44px; height: 44px; border-radius: 10px;
            background: white; border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 4px 14px rgba(0,0,0,.08);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #64748b; transition: all .25s ease;
            backdrop-filter: blur(8px);
        }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle:hover { background: #20457c; color: white; transform: scale(1.05); }
        [data-theme="dark"] .theme-toggle {
            background: rgba(30,41,59,0.8);
            border-color: rgba(255,255,255,0.08);
        }
        [data-theme="dark"] .theme-toggle:hover { background: #3b82f6; color: white; }
        @media (max-width: 1023px) {
            .theme-toggle { top: 16px; right: 16px; }
        }
        @media (max-width: 640px) {
            .theme-toggle { width: 38px; height: 38px; top: 14px; right: 14px; }
            .theme-toggle svg { width: 17px; height: 17px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"
            aria-label="Toggle dark mode" title="Toggle dark mode">
        <i data-lucide="moon" id="themeIcon"></i>
    </button>
    <script src="https://unpkg.com/lucide@latest"></script>
    <div class="h5p-page">
        <a href="./" class="back-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            Back to Portfolio
        </a>
        <div class="h5p-wrap">
            <div id="h5p-container">
                <div class="h5p-loading" id="h5p-loading">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                    <p>Loading scenario…</p>
                </div>
            </div>
        </div>
    </div>
    <script src="main.bundle.js"></script>
    <script>
        const container = document.getElementById('h5p-container');
        const loadingEl = document.getElementById('h5p-loading');
        try {
            new H5PStandalone.H5P(container, {
                h5pJsonPath: './h5p-activities/customer-service-mastery',
                frameJs:     './frame.bundle.js',
                frameCss:    './styles/h5p.css'
            });
            const obs = new MutationObserver(() => {
                const iframes = container.querySelectorAll('iframe');
                if (iframes.length > 0 || container.querySelectorAll('.h5p-container').length > 0) {
                    iframes.forEach(function(iframe) {
                        if (!iframe.getAttribute('title')) {
                            iframe.setAttribute('title', 'Customer Service De-Escalation Mastery - Branching Scenario');
                        }
                    });
                    loadingEl && loadingEl.remove();
                    obs.disconnect();
                }
            });
            obs.observe(container, { childList: true, subtree: true });
        } catch (e) {
            console.error('H5P failed:', e);
            if (loadingEl) {
                loadingEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" style="width:40px;height:40px;opacity:.7"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p style="color:#ef4444;font-weight:600;">Scenario failed to load</p><p style="font-size:.8rem;color:#94a3b8;">Ensure h5p-activities/customer-service-mastery is present and the page is served from a local server.</p>';
            }
        }
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }
        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            updateThemeIcon();
        })();
    </script>
</body>
</html>
